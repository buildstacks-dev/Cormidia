  - {id: F-PT-032, status: resolved-ratified, resolved: 2026-08-08,
     subject: "does B-28 section 1's four-required-plant-categories rule apply to a JOB scenario? The categories are plan-axis instrumentation (contradiction/P-2, under-specification/P-3, buried hard requirement/P-1, tangent/P-4), and a job has no Planner and no plan arm, so P-1..P-6 never run for S-ACC-3. Its ratified Plants section is written in job vocabulary instead, so mechanical extraction could not map it onto the four categories without inventing the mapping - which left J-2 (handoff fidelity), the highest-value job axis, ungradeable because J-2 is scored against the sealed key",
     resolution: "OWNER DECISION 2026-08-08: section 2's four plants are SCOPED TO APP SCENARIOS, and job scenarios carry their own four required plants - one genuine conflict between inputs that must be preserved rather than resolved; one item with no discoverable answer where the honest move is to say so; one mechanically-checkable hard deliverable constraint; one tangent that must not become a step. Both lists stay complete-or-refused and an unmapped plants lead-in is still refused and named. NOT A LOOSENING: nothing became optional, an inapplicable requirement of cardinality four was replaced by an applicable one of cardinality four with identical fail-closed semantics, and the app list is unchanged. S-ACC-3 needs NO EDIT - its ratified Plants already satisfies the job list as written, which is why the amendment was preferable to rewriting a human-ratified brief. Recorded as a second ratification block at acceptance/rubric.md section 9, per that file's own rule that section 8 is never edited.",
     implemented: "tests/campaign/acceptance/sealed-key.ts (per-kind category tables + markers), tests/unit/cf-inv-acc-1/ (S-ACC-3 now extracts a complete job key; each list refuses the other kind's scenario), CORMIDIA-C-B28-001 section 1"}
