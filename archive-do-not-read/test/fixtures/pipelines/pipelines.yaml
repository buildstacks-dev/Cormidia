# Fixture pipelines exercising every schema feature (build plan M2.1).
# Mirrors docs/loop/design.md §4's sketch shapes; the real root pipelines.yaml is
# a human-ratified surface landing via proposal PR in M2.2.

build:
  passes:
    - id: contract
      role: builder
      template: build/pass.md
      skip_on_tier: [quick]
    - id: implement
      role: builder
      template: build/pass.md
      effort: high
      model: gpt-5.5

review:
  passes:
    - id: verify
      role: reviewer
      template: review/pass.md
    - id: security-deep
      role: reviewer
      template: review/pass.md
      only_on: { risk: [high], dimension_globs: security }
    - id: perf-scale
      role: reviewer
      template: review/pass.md
      only_on: { labels: [op:perf-sensitive], dimension_globs: perf }

ship:
  mechanical: true
  passes:
    - id: ship-check
      role: reviewer
      template: review/pass.md
      only_on: { risk: [high] }

plan:
  passes:
    - id: visionary
      role: planner
      template: build/pass.md
    - id: pm-a
      role: planner
      template: build/pass.md
      parallel_group: competing-pms
    - id: pm-b
      role: planner
      template: build/pass.md
      parallel_group: competing-pms
    - id: arbitrator
      role: planner
      template: build/pass.md
