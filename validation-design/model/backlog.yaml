    lane: per-commit
    layer: L1
    acceptance_criteria:
      - "Archived source-ticket text (provenance only; dependency words here are non-operative): Cormidia declares a governed read scope from `--source`/`--optional-source` and the harness reads it with its own tools; the pre-read, the source-section coverage layer and the ingestion secret pre-scan are removed. *Acceptance:* (1) a required root that is missing/unreadable/non-regular refuses pre-runtime while an optional one records unavailable and proceeds; (2) a symlink escaping a declared root refuses and escalates; (3) a read outside every declared root is denied through the ordinary gate path, with no bespoke source-read mechanism; (4) **silent under-read never reports consumption** — a turn that reads nothing, or reads only text from an image-bearing scope, cannot produce a consumed manifest row, and the seeded narrate-without-reading liar turns the detector red; (5) an assignment lacking `media_read` for an image-bearing scope refuses before provider construction with typed remediation, and capability is read from the profile, never inferred from a model id (seeded control); (6) unobservable read evidence reports unobservable — never coverage, never a clean empty walk; (7) a mixed directory of Markdown + PNG + PDF plans successfully end to end with the image demonstrably read; (8) the INV-011 publication guard still refuses and no raw media byte crosses the publication boundary; (9) removal is complete — no Cormidia-side decode, classify, or content-embed path survives, asserted structurally. *Defends:* CORMIDIA-INV-017, CORMIDIA-C-B31-001…003, CF-J03-R's modality refusal leg. *Families:* CF-B31-\\*, CF-INV-017, CF-C-B31 (CF-B31-L3 is the separate per-harness live leg, gated on adapter certification and never claimed from documentation). *Layer:* 1/2 (+3 for CF-B31-L3). *Executor:* build-agent."
