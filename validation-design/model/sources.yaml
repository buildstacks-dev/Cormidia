  - id: SOURCE-OPEN-OBLIGATIONS
    kind: proposed
    path: validation-design/harness-design-state.md
    locator: "Current unresolved and human-action queue; every decision below remains unratified and must not be encoded as behavior. F-PT-012 decision brief: choose registry-before-local-clear or local-clear-first with the registry update as commit point; the choice determines crash authority/recovery; completion requires the chosen contract and implementation plus red-then-green crash cases at every step boundary. F-PT-013 decision brief: classify an agent direct push to the remote default branch as routine or critical and choose gate-classifier or delivery-loop-guard enforcement; the choice fixes authority ownership and refusal/audit locus; completion requires the ratified policy/contract, implementation, and a seeded refused direct-push detector. F-PT-014 decision brief: map outside-worktree behavior to the existing never-scopeable rule or explicitly named narrower classes; the choice determines whether grants can be widened; completion requires invariant/approval-contract mapping, rule implementation, and a seeded refusal detector. F-PT-015 decision brief: choose outright bootstrap-rerun refusal or deterministic idempotent exact-marked-block replacement preserving all other bytes; the choice determines legal recovery and foreign-content protection; completion requires B-14/implementation alignment plus rerun, byte-preservation, foreign-block, symlink, and interruption controls. F-PT-016 decision brief: assign wrong-remote comparison to B-14 bootstrap publication or B-15 remote identity; the choice names one owning seam; completion requires the owning contract/implementation and matching, mismatch, missing-identity, symlink, and remote-move comparison/refusal coverage. F-PT-018 decision brief: retain the bounded human-protected-merge plus exact-tag-rerun limitation without claiming mechanical merge blocking, or require branch protection; only the latter closes the finding, and completion requires durable protected-state observation plus a seeded red PR observed to be merge-blocked followed by green; this cutover performs no infrastructure action. B-17-L3 deliberate deferral: the non-GitHub real round-trip remains blocked because no disposable target is ratified. Unblock only when the human names that sandbox target and authorizes an exact reviewed absolute live config; then run the spend-bounded preflight/campaign, deposit exact-candidate evidence, and update HB-013-L3/CF-J17-A. Other open items: F-PT-009/010/011 threshold/sample designs; F-PT-033 marker compatibility; #339 Grok real-repository vendor-risk review; the simulated provider-family interpretation (its current implementation is a parked observation, not ratified policy); HB-072 distinct human author and independent reviewer before HB-073; and HB-090..094 comparison-wave activation. HB-155-L3 visual/media certification plan (not authorized here): exact harness matrix claude, codex, cursor, opencode, pi, grok, muse; media_read remains unsupported per exact runtime/version unless current adapter/tool-gate evidence, a reviewed absolute live config, exact per-run human authorization, sandbox target, image/PDF fixture, gate-observed read, and proof the model saw a visual fact all exist. Unsupported/unproven remains unsupported; Grok is sandbox-only pending #339; Muse cannot progress while its tool gate is unsupported. Human next actions are the named decisions and artifacts. Engineering next actions are pending tickets whose explicit depends_on outputs are landed; prose-only HB/F-PT references are provenance unless the backlog declares an edge. Superseding ratification-to-engineering handoff: the earlier ‘pending tickets whose depends_on outputs are landed’ sentence is shorthand and never selects work by itself; apply the complete navigation/status rule. These open findings authorize no code now. When the owner rules, the same checked-model revision must update the named existing output, change it to pending only if every readiness predicate holds, and bind exact family/control/planned-test-or-evidence paths and depends_on edges before a build agent acts: F-PT-009 → HB-061; F-PT-010 → HB-062-L4; F-PT-011 → HB-062, HB-062-L4, and HB-093/HB-093-L2/HB-093-L4 (plus HB-108 only if its already-landed S-10 threshold contract changes); F-PT-012 → HB-015; F-PT-013 → HB-010 and HB-010-L2; F-PT-014 → HB-011; F-PT-015 → HB-P4; F-PT-016 → HB-P4 when B-14 owns the seam or HB-025 when B-15 owns it; F-PT-018 → HB-P7; F-PT-033 → HB-005. A ruling that omits this model/ticket update is incomplete, and the build agent refuses. The #339 disposition updates the Grok scope recorded in HB-137-L3 but never widens it implicitly. Blocked-transition correction: clearing a blocker or landing dependencies never authorizes execution by itself. HB-013-L3, HB-073, HB-137-L3, HB-155-L3, and every other blocked output require a checked-model revision to pending before any implementation, certification, or evidence run; only pending work may later become landed. Any earlier ‘then run’ wording is conditional on that mandatory intermediate transition. #339 standalone Grok vendor-risk decision brief. Decision: whether Grok Build may move beyond its current throwaway-sandbox-only scope to any real repository. Permitted attributable human outcomes are retain-sandbox-only, approve-bounded-real-repository-use, reject-real-repository-use, or needs-more-evidence (which leaves the item open and sandbox-only). Assess vendor terms; code/input retention and training use; confidentiality and deletion; network, subprocess, filesystem, and tool isolation; PreToolUse/gate integrity; telemetry/logging; incident response; version drift; and revocation. Completion artifact: research/adapters/grok-build-vendor-risk-review.md, authored or approved by the human product owner and carrying reviewer identity, reviewed_at, exact Grok runtime/version profile, evidence/source links, every criterion's disposition, chosen outcome, allowed repository/data/tool/network scope, expiry or re-review trigger, revocation conditions, and artifact SHA-256. retain/reject/needs-more-evidence preserves CF-B25-L3 sandbox-only scope. approve requires a checked-model revision updating B-25/CF-B25-L3 and affected tickets from the exact artifact; it never authorizes a run or real-repository use by itself, and every live run still needs its declared reviewed config and per-run human authorization. Missing artifact fields or model transition means remain sandbox-only. Checked-model revision field map for every ratification handoff: update validation-design/model/sources.yaml when decision provenance changes; validation-design/model/structures.yaml for the affected clause/source_ids while preserving changed_paths: [] unless a separately ratified complete map exists; validation-design/model/controls.yaml for the red-capable expected failure; validation-design/model/families.yaml for status, lane, control_ids, ticket, exact planned_tests or evidence; and validation-design/model/backlog.yaml for ticket status, depends_on, family_ids, and acceptance. Update validation-design/model/policy.yaml only when lane/trigger/authorization changes, validation-design/model/owners.yaml only when ownership changes, and validation-design/model/project.yaml only for product/version facts. Regenerate, never edit views. A blocked/parked-to-pending transition is incomplete unless backlog status/dependencies and every owned family/control/path/source field agree in the same checked-model revision. Exact F-PT-009/010/011 ratification payloads. F-PT-009 is one S-3 Reviewer ruling and must record corpus/version, serious-defect classes, per-severity catch thresholds, clean false-positive threshold, N, defect/clean counts, builder×reviewer pairing strata, aggregation, uncertainty/inconclusive rule, cadence, owner, date, and resulting HB-061/CF-S3-qual/CF-S3-judge transition or explicit corpus-only split. F-PT-010 requires two explicit site sections, S-1 Planner and S-4 SRE; each records corpus/version, metric, threshold, N, sample composition, aggregation, uncertainty/inconclusive rule, cadence, owner, and date. Omission leaves that site open; HB-062-L4 cannot become pending until both are ratified or its families are split. F-PT-011 is an umbrella, not one blanket YES/NO: record a separate complete section for CF-COND brief conditioning and for each S-2 Builder, S-5 Audience (Support, Marketing content, Marketing analysis), S-6 Distiller, S-7 Learning Reviewer, S-8 Selection Judge, and S-10 Validation Designer site. Every section carries corpus/version, metric/threshold, N, case counts/composition, strata, aggregation, calibration/reference procedure, uncertainty/inconclusive rule, cadence/trigger, owner, date, and affected ticket/family transition. Sites may ratify independently; omitted sites remain inconclusive and blocked. The same checked-model revision updates HB-062/062-L4, HB-093/093-L2/093-L4, and HB-108 only for the exact site families it changes, splitting mixed outputs before any partial subset becomes pending. Live authorization order correction: target/config-shape ratification and exact per-run authorization are distinct. For HB-013-L3, first the human names the disposable sandbox target and the checked-model revision binds the target plus config requirements and changes the ticket to pending. The operator then prepares the reviewed absolute config and runs non-spending dry-run/preflight. Only after those exact outputs exist may the human issue fresh per-run authorization for that candidate/config; then, and only then, the spend-bounded live run may start. A config review before preflight is not per-run authorization, and no prior authorization carries forward."
