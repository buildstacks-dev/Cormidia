  intended_use: "Installable private-org runtime whose standing AI team develops and operates software under human-gated critical operations and fail-closed validation evidence. This checked graph is bound to exact product revision 21094d5d5bc81ebde56117d6059c1c2b973e06bc. Model identity is exact-candidate identity: it hashes the complete checked model, including that product.revision; changing the candidate changes the model identity. Reader start: use owner-briefing.md for policy, lane authorization, status semantics, and unresolved decisions; owner-backlog.md for owner/status; harness-backlog.md for acceptance and explicit dependencies; case-catalog.md for families and controls; planned-trace.md for provenance and routing; compiler-report.json and reader-bundle-identity.json bind the exact generated graph and seven-file bundle. Navigation correction: the generated owner-briefing section titled “The decisions on your desk” is a family disposition inventory, mostly resolved PRUNED rows; it is not the human-action queue. Actual unresolved human decisions are under “What is still unknown,” and executable engineering selection additionally requires the full ticket navigation/status rule in harness-backlog.md. The bundle is standalone navigation, not normative or editable authority: validation-design/model/*.yaml remains sole checked Validation Architect authority. Before reader review, reader-bundle-identity.json binds only the other six payload files plus their compiled graph identity; the external reader-review digest is required to bind the identity file as the seventh byte payload; it does not prove current GitHub state, current test or qualification evidence, production authorization, or release permission. IMPLEMENTABLE means a required family has a canonical implementation or evidence slot; it does not mean an open product-truth or sampling decision, code, execution, or evidence is complete, and an owning ticket/finding may still make it non-actionable. landed means the implementation record landed, not that evidence is current; pending, blocked, and parked remain incomplete; complete, incomplete, inconclusive, and unobserved evidence states never collapse into one another. Compiler accepted proves graph consistency only, never test passage, current assurance, production readiness, or release permission. The seven-file reader bundle is insufficient by itself to authorize or run this lane. Leave the reader sandbox; consult canonical docs/qualification/design.md and docs/qualification/host-policy.yaml; prepare a reviewed absolute configuration; run the required dry-run and preflight; obtain exact per-run human authorization; bind every evidence artifact to the exact candidate; and obtain the required aggregate attestation before any release use. Missing any prerequisite means refuse—never infer authority from this bundle, a prior run, or a landed ticket. RQ-1 additionally requires the current exact-candidate aggregate attestation and a separate exact human release approval. Bundle-binding correction: reader-bundle-identity.json hashes the other six payload files and binds their model_identity/product_revision, but cannot recursively hash itself. Before reader-reviews.yaml exists, the seven-file root is not self-authenticating. The external bundle SHA is SHA-256 over the exact reader-bundle-identity.json bytes including its final newline; a conforming reader-reviews.yaml records that digest and the model identity, completing the reviewed seven-file byte binding. Even then the record proves only those bytes and identities, never current GitHub state, authorization, evidence freshness, or release permission. Checked-model edit map: validation-design/model/project.yaml owns product/version facts; validation-design/model/owners.yaml owners; validation-design/model/sources.yaml source records; validation-design/model/structures.yaml structure meaning/acceptance/source_ids/changed_paths; validation-design/model/policy.yaml layers,