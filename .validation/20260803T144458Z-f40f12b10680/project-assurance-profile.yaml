  required_confidence: "High confidence in deterministic guards and failure-state transitions; no claim about unrun external seams."
  mandatory_claim_categories: ["functional", "safety", "reliability", "recovery", "operational", "evidence-integrity"]
  mandatory_evidence_classes: ["requirement", "analysis", "test", "inspection", "process_control"]
  minimum_independence: "I2 for this merge-scoped assessment; I3 or separately authorized external evidence for production activation claims."
  acceptance_authority: "Repository owner for merge; human operator for scheduler activation/live qualification."
  residual_risk_owner: "Cormidia repository owner"
  constraints_and_controls:
