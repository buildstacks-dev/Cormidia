      J-21/F-PT-030:
        disposition: A declared plan_gate policy may resolve the scored gate unattended only under the ratified rubric criteria and with durable resolution before build-arm spend; silence still refuses, and L-ACC remains non-gating.
        exact_structure_record:
          id: J-21
          kind: journey
          title: Outcome acceptance campaign (L-ACC)
          meaning: "Outcome-acceptance work emits a durable report for the work actually reached. A plan-gate stop is complete for the plan arm and incomplete for the unrun build arm; it is never a whole-campaign pass or complete build campaign. Every absent axis remains ungraded, every threshold-dependent verdict remains inconclusive, and L-ACC stays outside RQ-1. Implementation path mapping is unresolved, so no bounded subset is claimable and changed_paths stays empty rather than inventing paths. Deterministic discovery procedure: (1) describe the changed behavior and read the changed source; (2) match every relevant structure by its meaning and source_ids, resolving those source IDs in planned-trace.md; (3) traverse each matched structure → family → control → ticket through case-catalog.md and harness-backlog.md; (4) inspect the family's planned_tests or evidence path plus its cited source paths to locate the implementation and detector seams. Those inspection paths are discovery evidence, not invented changed_paths. If zero, multiple, or unresolved mappings remain, retain every semantic match and claim no bounded subset. If the traversal cannot resolve at least one owning family/control/ticket chain, do not select a ticket or guess a model edit: record the mapping gap as an F-PT finding in the authored harness-design-state register, keep the affected work blocked, and proceed only with structure-independent work. The exact safe operator action is therefore semantic traversal followed by either the resolved chain or refusal plus that finding—not intuition. Until implementation-path mappings are ratified, every changed product path widens planning to the authoritative full offline suite: run `pnpm test`, `pnpm validation:trace`, `pnpm check`, and `pnpm build`; L3-L6 live, eval, soak, and L-ACC lanes additionally run only when their declared trigger applies and an exact reviewed configuration plus per-run human authorization exist."
          acceptance_criteria:
            - "Given a campaign config with any preflight defect — an unrun or failed `pnpm install:packaged --replace-source-links`, `effort: max` on a harness other than `claude`/`opencode`, an app arm whose planner, builder and reviewer are one provider family, an `adaptive_assignments` candidate with neither a real `qualification_ref` nor an uncertified disclosure, a commit pin ≠ HEAD, or a scenario repository resolving to this repository — then the campaign refuses at **preflight**, before any runtime is constructed, repository mutated, or token spent, naming the exact defect. [B-27 §1/§2, INV-ACC-3/7b, INV-001/015]"
            - Given any grader turn, then no byte of the sealed answer key is present in its assembled input **or** reachable from any surface it can read with its own tools — including the scenario repository's git history — and the key is applied mechanically only after every grader turn for that scenario has terminated. [B-28 §2/§4, INV-ACC-1]
            - Given a model-graded axis, then the grading turn's provider family is disjoint from every turn that axis reads, the check ran before provider construction, and the disjointness set actually applied is recorded in the report; given no legal grader exists for that axis, it reports `ungraded` rather than being graded by a correlated provider. [B-29 §2, INV-ACC-2]
            - Given the plan arm has completed, then no build-arm token is spent until that scenario's plan gate resolves on a score and that resolution is recorded with the scores it acted on; given an unattended campaign with a declared `plan_gate` policy, the policy may author that resolution (F-PT-030, 2026-08-07) provided the ratified rubric §6 criteria are met, and given no declared policy the campaign refuses. A campaign that stops at the gate is reported complete-for-the-plan-arm, never failed. [B-27 §1.8/§4, INV-ACC-4]
            - "Given any campaign result, then no release path consumes it: L-ACC never enters RQ-1 completeness, verdict, or qualification, and no surface presents a score as a block. [B-27 §4, F-PT-029]"
            - Given any axis whose evidence is missing, or whose score arrived without its mandatory evidence citation, then it reports `ungraded`; `ungraded` never becomes `0`, never enters an aggregate as a number, and every aggregate names its graded denominator. Given any unratified threshold, the verdict is `inconclusive` — never pass/fail. [B-27 §4, B-29 §3, INV-ACC-5, `docs/qualification/host-policy.yaml` `outcome_acceptance.axis_score`]
            - "Given a ceiling exhaustion, a killed scenario, or a missing grader run, then that scenario reports `completeness: incomplete` with partial evidence preserved and remains present in the report. [B-27 §3, INV-ACC-6]"
            - "Given the whole campaign, then every product-affecting action traces to the **packaged** `cormidia`/`cormidia-job` binaries: no scenario-repo commit, branch, PR, issue or file write carries the supervising agent's identity, no provider SDK is called outside a Cormidia turn, and the report answers \"which bytes did this exercise\" from the installed version and tarball identity alone. A scenario whose invocation audit, commit authorship and run journal do not reconcile reports `ungraded` / `incomplete` rather than a score. [B-27 §2, INV-ACC-7a/7b]"
            - Given a completed campaign, then no app was deployed and no deploy grant was held; the deliverable is a buildable app plus a preview command in the report. [B-27 §5, T-12]
          failure_modes: []
          changed_paths: []
          owner: bikramgupta
          source_ids:
            - SOURCE-SYSTEM-MAP
            - SOURCE-CONTRACT-JOURNEY-ACCEPTANCE
