# validation-policy.yaml — Cormidia replacement harness
# This file is the contract a future validation-harness-audit diffs conformance
# against. Status: RATIFIED by the product owner 2026-07-31 (in session; record in
# ratification-package.md -> "Ratification record — 2026-07-31").
# Every decision here traces to the campaign artifacts under validation-design/.
# Tighten-only: a narrower module policy may tighten, never loosen, anything here.
# changelog 2026-07-31 (final-gate refusal): rewritten to parse as valid YAML with
# owner/trigger as separate keys; artifacts registry completed (readme, agents-md
# contribution, policy self-reference); B-17-live renamed B-17-L3; F-PT-006/007/008
# statuses corrected to open-blocked-contract.
# changelog 2026-07-31 (ratification): design_status -> ratified; release_campaign
# spend amended (24 turns / $100); F-PT-002 resolved with recorded facts;
# F-PT-003/004/007 resolved-ratified (their sentences are contract truth);
# F-PT-005 human-ratified by adoption. F-PT-006/008/009/010/011 remain open.
# changelog 2026-07-31 (harness revision): F-PT-017 records the provider terminal-
# status vocabulary conflict; F-PT-018 records that the configured GitHub plan cannot
# enforce required checks. Required target gates remain tighten-only; observed
# enforcement gaps are explicit rather than represented as green.
# changelog 2026-08-01 (owner-confirmed harness revision): register the proposed
# comparative-execution design (M16/J-19/B-18/B-19/S-8). Existing ratified gates,
# tiers, spend bounds, and tooling are unchanged. New case families are design-only;
# S-8 scores remain inadmissible under F-PT-011 until calibrated and ratified.
# changelog 2026-08-03 (owner-accepted Phase 8 implementation contract):
# register the roadmap/validation/delivery-unit/batching revision
# (M17/J-20/INV-016/B-20..22/S-10/C-OP-BATCH/C-OP-VALIDATION). Existing ratified
# gates, tiers, spend bounds, tools and blocked findings are unchanged. The owner
# accepted the exact section 10.1 decision and authorized local implementation from
# HB-100; protocol surfaces, merge, publication/deployment and live/eval/soak remain
# separately gated. Acceptance is not implementation evidence.
# changelog 2026-08-03 (HB-102 implementation): the deterministic validation-contract
# schema/catalog/lifecycle/readiness guard and exact hash lineage are executable at L1/L2.
# changelog 2026-08-03 (HB-103/HB-104/HB-105 implementation): production loop admission
# now consumes current RoadmapPlan/readiness/validation authority; delivery-unit claim,
# PR/HEAD/evidence/review/merge projections are whole-unit; bounded token-free batches
# own lazy plans, budgets, journals and outcomes; structured creator/direct authorities
# alone qualify for zero-turn normalization.
# changelog 2026-08-03 (HB-106/HB-107 implementation): complete direct campaign
# authorities bind five Reddit, one LinkedIn and one Twitter destination to one content
# turn but seven approval/acknowledgement/evidence/follow-up identities; planning and
# delivery share orchestrateEpisode; ordered immutable-prefix/unit-delta manifests,
# exact session compatibility and cache hit/miss/unknown telemetry are executable at
# L1/L2. No connector, external effect or live/eval/soak campaign ran. HB-108..111 and
# protocol ratification remain pending.
# changelog 2026-08-04 (HB-108/HB-109 machinery/HB-110): the accepted validation
# catalog now contains the complete deterministic 2026-08-03 registry and a new
# content pin; its closure walk fails on empty families or missing seeded detectors.
# Planner and Validation Designer pre-tuning corpora run as pending, unscored data
# collection and stay inconclusive under F-PT-010/011. The contention rig now covers
# overlapping batches, duplicate stimuli, atomic multi-ticket claims, mixed sibling
# settlement and stale frontiers; the soak collector records the same batch/cache/
# recovery denominators, but no seven-day campaign ran. CLI Status, Reports and Observe
# consume one read-only explanation projection. No protected protocol surface changed.
# changelog 2026-08-03 (owner decision): exact manual-review independently excludes
# autonomous Planner readiness and Builder whole-unit claim; Cormidia never removes it.
# No manual-* wildcard exists; manual-feelview is tracked only as HB-112 taxonomy audit.
# changelog 2026-08-05 (owner-ratified F-PT-022 resolution): L4 per-case
# token_reservation, campaign max_tokens, and observed_tokens count output tokens only,
# consistent with PURPOSE's 2026-07-20 retirement of input-token admission ceilings.
# Input/cache usage remains evidence and equivalent-USD input; unknown usage debits the
# reservation, while a known output overrun preserves exact evidence and debits actual
# output against the authorized campaign envelope. Existing golden reservations and
# the 49,500-output-token full-corpus sum remain unchanged.

