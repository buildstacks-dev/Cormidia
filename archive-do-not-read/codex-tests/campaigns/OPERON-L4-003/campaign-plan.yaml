stages:
  diagnostic:
    purpose: Prove the narrow minimal-gate rule addresses the attributable EP004 miss.
    case_ids: [OPERON-EP-004]
    runs_per_case: 3
    qualification_claim: prohibited
    entry_gate:
      - all_local_deterministic_detectors_except_tracked_product_defects_pass
      - exact_overlay_hash_matches
      - exact_delegated_human_provider_authorization_present
      - exact_delegated_spend_decision_present
    pass_gate:
      deterministic_contracts: 3_of_3
      quality_acceptable: 3_of_3
    spend:
      status: human_authorized_by_delegation
      aggregate_ceiling_usd: 10
      per_turn_ceiling_usd: 5
      stop_before_exceeding: true
  qualification:
    purpose: Run a fresh comparable qualification only after the unchanged candidate passes the diagnostic and its evidence audit.
    corpus_cases: 10
    runs_per_case: 3
    total_attempts: 30
    overall_min_acceptable: 27
    min_acceptable_per_case: 2
    critical_min_acceptable_per_case: 3
    deterministic_contracts: blocking
    entry_gate:
      - diagnostic_passed_without_candidate_change
      - independent_diagnostic_audit_passed
      - exact_diagnostic_evidence_hashes_bound
    spend:
      status: human_authorized_by_delegation
      aggregate_ceiling_usd: 60
      per_turn_ceiling_usd: 5
      stop_before_exceeding: true

failure_handling:
  qualification_on_failure: none
  preserve_current_assignment: true
  preserve_original_and_follow_up_evidence: true
  prompt_or_corpus_edit_to_green: prohibited
  candidate_change_after_diagnostic: requires_new_campaign_version

