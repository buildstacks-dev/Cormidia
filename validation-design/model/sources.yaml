  - id: SOURCE-PROPOSED-FPT-033
    kind: proposed
    locator: "Human decision required — F-PT-033. Existing [doc] facts—review values approve|findings and the three documented predecessor status formats—are not reopened. Decide each remaining compatibility rule independently: (1) ratify duplicate-identical operative markers, or require exactly one operative marker; (2) retain Verdict-before-Status precedence, or state the replacement cross-keyword rule; (3) ratify the bare-line marker form, or reject it and name the accepted replacement form. Rejected current behavior requires parser and pinned-regression changes red-then-green. Until decided, current tests record behavior only; no new test may turn either reading into contract truth. Ratification handoff: the same checked-model revision must update HB-005, change it from landed history to pending only if implementation is required, and bind the selected parser clause to its exact control and tests/unit/cf-inv-012/s3-verdict-marker.test.ts red-then-green change. Until that revision lands, no parser or regression-test edit is engineering-ready."
