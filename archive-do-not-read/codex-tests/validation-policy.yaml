journey_risk:
  - id: J-01
    name: install_and_discover
    likelihood: plausible
    impact: major
    rating: high
    reason: Package/version failure can make the product unusable or misstate capability.
    overrides:
      package_integrity_and_supply_chain: critical
  - id: J-02
    name: create_select_upgrade_org
    likelihood: plausible
    impact: catastrophic
    rating: critical
    reason: Cross-org access, secret exposure, corrupt migration, or broad local deletion violates isolation.
  - id: J-03
    name: onboard_and_promote_product
    likelihood: plausible
    impact: major
    rating: high
    reason: False readiness can admit unsafe autonomous work.
  - id: J-04
    name: intake_and_prioritize
    likelihood: likely
    impact: catastrophic
    rating: critical
    reason: Untrusted GitHub/channel content can attempt prompt injection or poisoned routing.
  - id: J-05
    name: decompose_work
    likelihood: likely
    impact: major
    rating: high
    reason: Bad decomposition cascades into wasted work, weak acceptance, and poor final outcomes.
  - id: J-06
    name: plan_episode
    likelihood: likely
    impact: catastrophic
    rating: critical
    reason: The plan selects roles, tools, dependencies, approvals, budgets, and the execution route.
  - id: J-07
    name: execute_episode
    likelihood: likely
    impact: catastrophic
    rating: critical
    reason: Autonomous tools can mutate source, files, GitHub, spend, and later effects.
  - id: J-08
    name: authorize_and_execute_effect
    likelihood: plausible
    impact: catastrophic
    rating: critical
    reason: Approval confusion, duplicate execution, or wrong-target effects may be irreversible.
  - id: J-09
    name: recover
    likelihood: plausible
    impact: catastrophic
    rating: critical
    reason: Incorrect recovery can repeat effects, lose accepted work, misattribute spend, or cross scope.
  - id: J-10
    name: observe
    likelihood: plausible
    impact: major
    rating: high
    reason: Missing traceability, leaked secrets, or false health impairs incident response and trust.
    overrides:
      pure_visual_rendering: moderate
      redaction_path_and_truthfulness: critical
  - id: J-11
    name: learn
    likelihood: plausible
    impact: catastrophic
    rating: critical
    reason: Poisoned learning persists malicious or incorrect behavior into future work.
  - id: J-12
    name: periodic_review
    likelihood: plausible
    impact: moderate
    rating: moderate
    reason: A report-only failure is recoverable while the behavior remains planned.
    overrides:
      active_governance_or_context_mutation: critical
  - id: J-13
    name: non_software_delivery
    likelihood: plausible
    impact: major
    rating: high
    reason: Weak artifact quality or false verification can damage customer trust.
    overrides:
      external_publication_effect: critical

