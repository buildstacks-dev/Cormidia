  - {id: F-PT-022, status: resolved-ratified, resolved: 2026-08-05, subject: "L4 token accounting: whether per-case reservations and campaign max_tokens count output tokens only, uncached input plus output, or every vendor-reported input/cache-create/cache-read/output token; and how a known actual overrun settles against the authorized envelope",
     resolution: "contract truth: per-case reservations, campaign max_tokens, and observed_tokens count output tokens only, consistent with PURPOSE's retirement of input-token ceilings. Input/cache usage remains preserved telemetry and contributes to equivalent-USD accounting, but never debits the token envelope. Unknown-use failures conservatively debit the effective output reservation. Known results debit exact output; an output overrun is preserved, remains incomplete/inconclusive, and continues independent cases only while the authorized campaign envelopes admit them. Golden token_reservation values remain human-reviewed baselines. A content-bound human-approved release config may raise effective reservations only by naming every selected case exactly once, never lowering a baseline, and binding max_tokens to their exact sum. For #300, two times each observed overrun rounded up to 100 gives DAG=5,700, REPAIR=6,600, BATCH-LURE=8,700, DIRECT-PROMOTION=12,100, ROUTINE=8,000, CROSS-TICKET=9,500, and STRUCTURAL=4,700; unaffected cases retain baseline values and the effective full-corpus sum is 88,100."}
