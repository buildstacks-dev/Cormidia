    kind: proposed
    locator: "Human activation required before engineering: the product owner must explicitly ratify SOURCE-PROPOSED-COMPARISON and authorize the HB-090..094 comparison wave. Every output remains blocked until a checked-model revision changes the intended work to pending; prose activation alone is not executable authority. Operative order after that revision: HB-090 → HB-090-L2; HB-091 depends on HB-090 and HB-091-L2 depends on HB-090-L2 plus HB-091; HB-093 → HB-093-L2 → HB-093-L4 remains blocked until F-PT-011 is ratified or the threshold-independent corpus is split into disjoint outputs; HB-094 depends on HB-090-L2, HB-091-L2, and HB-093-L4 and separately requires its harness revision. HB-092 has no canonical output, so HB-094 cannot unblock until a checked-model revision either creates it or records that it is unnecessary and removes the source prerequisite. Design facts live at validation-design/system-map.md J-19 and boundary-map.md B-18/B-19."
