  - {id: F-PT-008, status: resolved-ratified, resolved: 2026-08-12, subject: "grant-expiry item disposition",
     resolution: "owner decision 2026-08-12: an expired grant REOPENS THE ORIGINAL ITEM — never a silent fresh item, never a dropped operation. The item returns to the pending queue under its ORIGINAL id with its decision history intact; B-09b immutability is preserved because the reopen is an APPENDED log transition over immutable decision records, never an edit of one. Two further rulings in the same decision. (1) The grant TTL resolves through POLICY CONFIGURATION, never a source constant (the F-PT-020 precedent) — and it is wired to org configuration, not merely exposed as a code-level constructor option no production call site passes. (2) The default grant TTL changes from 24h to 48h. THE INTERACTION THE OWNER REQUIRED TO BE CHECKED WAS REAL AND IS DECIDED HERE: resolveApprovalPolicy derived `pendingTtlMs` from `grantTtlMs`, so a 48h grant default would ALSO have doubled F-PT-020's ratified 24h undecided-item lifetime (worst-case raise-to-grant-expiry 48h to 96h), loosening an enforced bound. The owner ruled the pending-item TTL default is PINNED at 24h and no longer inherits the grant default. F-PT-020's 'matching the grant TTL' phrasing described the then-equal defaults, not a binding coupling; the two defaults are deliberately decoupled and only the grant side lengthens. cormidia app verify's counting rule is unchanged. Implementation owed under HB-P5 (product change + detectors, red-then-green)"}
