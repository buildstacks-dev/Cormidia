name: Self-hosted runner probe

# HB-152 staged proof: this workflow proves the isolated Mac-backed runner with
# a real GitHub-assigned job before Core checks changes its runs-on target.
# It is retained after cutover as the narrow runner-appliance smoke.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: cormidia-core-linux-arm64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove the ephemeral runner boundary
        run: bash scripts/self-hosted-runner/probe.sh
