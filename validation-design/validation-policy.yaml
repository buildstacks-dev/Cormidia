     subject: "F-PT-036's classifier-throw ruling (deny AND escalate) was scoped to the codex/cursor/opencode socket bridges, but the muse and grok bridges deny fail-closed in their own catch branches WITHOUT appending a GateEscalation, and src/runtime/adapters/pi-gate.ts wraps its hooks.gate() call in no catch at all — whether INV-015 adversarial seed (c) extends to these three seams is an owner decision",
     resolution: "owner decision 2026-08-12: YES — all three seams. muse and grok route their classifier-throw catches through classifierThrowDenial (deny + GateEscalation) exactly like the first three bridges, and pi gains its own catch. THE EMPIRICAL L2 DETERMINATION THE OWNER REQUIRED BEFORE RULING ON pi: pi is currently fail-CLOSED, but the property belongs to the VENDOR, not to Cormidia. pi-gate.ts never catches; the throw propagates out of the SDK's ExtensionRunner.emitToolCall — which, unlike its emitUserBash and emitContext siblings, wraps no handler in try/catch — and it is pi-agent-core's prepareToolCall catch that converts the rejection into an error tool result, so the tool never executes. That is a version-banded vendor behavior a single bump could silently invert, and nothing escalates today in either case. Cormidia therefore owns its own fail-closed denial at the seam, per the standing runtime rule that an unproven gate is an ungated turn. INV-015's text is unchanged (narrowing it would be a tighten-only violation); this widens WHERE the ratified seed is enforced. Implementation owed under HB-153 (product change + detectors, red-then-green, incl. seeded permissive-fallback controls per seam)"}
  - {id: F-PT-038, status: resolved-ratified, resolved: 2026-08-12,
     subject: "src/org/episode-planner/policy.ts resolves independent-review seats BY ROLE NAME (defaultBuilderReviewerPolicy finds roles literally named builder/reviewer) and returns undefined when the org chart has neither, so a route whose EpisodeIntent carries the independent_review safety fact skips the whole `if (review !== undefined)` block and the HB-133/CF-REVIEW-PROVIDER cross-provider-family guard silently never runs — while two lines below, an EMPTY seat list deliberately fails closed with error_review_provider_family_unresolvable. The same unsatisfiable policy therefore fails closed one way and open the other, decided by role naming (surfaced in the PR #416 body)",
     resolution: "owner decision 2026-08-12: FAIL CLOSED. When a route requires independent_review and NO review policy resolves — neither an explicitly configured one nor the name-based default — the episode refuses before provider construction under the same typed error class as the adjacent empty-seat-list branch. A safety control that can cover nothing must never read as satisfied (standing rule 2: guardrails enforce, evals measure); a guard whose presence depends on whether someone named a role 'reviewer' is not a guard. The name-based default is RETAINED as a convenience rather than removed: the refusal names explicit seat configuration as the remedy, so an org that does not use the builder/reviewer naming convention has a stated path instead of a silently absent control. Implementation owed under HB-154 (product change + detectors, red-then-green)"}
