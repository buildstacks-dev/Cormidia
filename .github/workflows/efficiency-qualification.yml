name: Efficiency qualification

# Change-aware lanes. Four jobs, each with one responsibility:
#
#   classify          resolve changed paths -> lane admission (scripts/ci/classify-changes.mjs)
#   core              the offline suite EXACTLY ONCE + typecheck + token-free contract gates
#   observer-reports  the browser/smoke/pack checks AGENTS.md requires for Observer/Reports
#   release-currency  fail-closed product-currency, release tags + manual dispatch only
#
# The previous single `deterministic` job ran `test:transformation`,
# `eval:deterministic`, the full vitest suite and `test:transformation:strict`
# in sequence. Those four steps re-executed test/transformation + test/eval four
# times (six on the nightly schedule) because each umbrella script bundles a
# vitest invocation with a distinct non-vitest assertion. The distinct
# assertions cost ~2s in total (eval:validate ~0.9s, run-contracts ~0.6s,
# run-contracts --strict ~0.6s); everything else was duplication. The core lane
# now runs the offline suite once and calls the contract gates directly, so no
# coverage is lost and ~340s/run of duplicate vitest disappears.

on:
  push:
    branches: [main]
    tags: ["v*", "release-*"]
  pull_request:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

# Supersede in-flight PR runs only. A push to `main` and a release tag must
# always run to completion: this repository has no branch-protection
# enforcement, so the `main` run is the only check a direct push receives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.lanes.outputs.core }}
      observe: ${{ steps.lanes.outputs.observe }}
      build: ${{ steps.lanes.outputs.build }}
      nightly: ${{ steps.lanes.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve changed paths and admit lanes
        id: lanes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A schedule, tag or dispatch is never path-optimised, and an
          # unresolvable base (first push, force-push, deleted ref) admits
          # every lane. classify-changes.mjs fails open into MORE testing.
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            printf '' | node scripts/ci/classify-changes.mjs --no-diff
          else
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | node scripts/ci/classify-changes.mjs
          fi

  core:
    needs: classify
    if: needs.classify.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the release attestation can resolve the qualified
          # candidate commit (see scripts/eval/release-attestation.ts). Without
          # it the default shallow checkout (depth 1) leaves the candidate commit
          # absent and the verifier now fails closed (ROOT-001).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build only where the affected surface or packaging contract requires it.
      # No offline test depends on a real `dist/` (the eval fixtures write their
      # own), so a test-only change skips it.
      - name: Build
        if: needs.classify.outputs.build == 'true'
        run: pnpm build
      # The complete offline suite, executed EXACTLY ONCE. This includes
      # test/transformation, test/eval, test/efficiency, test/lifecycle,
      # test/continuation and test/scheduler, so the former
      # `test:transformation` and `eval:deterministic` steps are fully subsumed.
      - run: pnpm test:offline
      - run: pnpm typecheck
      # Token-free qualification gates. These are the assertions the umbrella
      # scripts uniquely contributed; `evaluateContracts` verifies evidence
      # presence and the exact declared debt set without probing source text, so
      # running them once here is complete. Deliberately UNCONDITIONAL: strict
      # enforcement stays on every CI invocation (J-REL-01).
      - run: pnpm eval:validate
      - name: Contract inventory (scope all, exact known-red)
        run: pnpm eval:contracts
      - name: Strict current Phase 6 gate
        run: pnpm eval:contracts:strict
      # Order/concurrency-dependence tripwire. Distinct invariant from the run
      # above: seed 20260712 at two workers detects order dependence, seed
      # 12072026 at one worker detects concurrency/serialisation dependence.
      # Nightly only, and no longer preceded by the ordinary deterministic stack.
      - name: Nightly deterministic flake tripwire
        if: needs.classify.outputs.nightly == 'true'
        run: pnpm eval:deterministic:nightly

  # Observer / Reports lane (AGENTS.md). Runs only when Observer, Reports, their
  # CLI surfaces, the packaging/home-resolution/onboarding contract, or the
  # Playwright config change. The focused Observer/Reports SEMANTIC tests are
  # deliberately NOT repeated here: test/observe/*.test.ts and
  # test/report/*.test.ts already run in the core lane's single offline suite
  # execution, and an Observer change always admits the core lane too. This lane
  # adds only what the core lane cannot provide — the real Chromium run and the
  # packaging/onboarding contract.
  observer-reports:
    needs: classify
    if: needs.classify.outputs.observe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:observe-browser
      - run: pnpm smoke:onboarding
      - run: npm pack --dry-run

  # Release product-CURRENCY gate (P0-07 / ROOT-001 integrity/currency separation,
  # docs/PURPOSE.md 2026-07-17). The `core` job above proves evidence INTEGRITY on
  # every push/PR and is honest-green whenever the committed evidence is intact.
  # This job proves the LIVE product still hashes to the qualified pin
  # (product-CURRENCY) and fails closed when it does not. It is deliberately gated
  # to release tags and manual dispatch — NOT ordinary push/PR — so per-commit CI
  # is not permanently red after a legitimate src change; a release from
  # post-Wave-5 main is expected to be RED here until a fresh qualification
  # campaign re-attests. This is where a moved/fabricated product is refused.
  release-currency:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the release attestation's changed-path check can
          # resolve the qualified candidate commit and fail closed on its absence.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Release product-currency gate (fail-closed)
        run: pnpm eval:release-verify
