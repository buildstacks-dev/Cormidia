tooling:
  status: ratified
  selected_on: 2026-07-29
  selection: recommended_coherent_stack
  isolation:
    harness_root: ./
    package_manifest: ./package.json
    lockfile: ./pnpm-lock.yaml
    dependency_policy: independent_from_product_package
    generated_output_root: ./.artifacts/
    product_package_scripts_changed: false
    incumbent_runner_configuration_changed: false
  runtime:
    language: typescript_strict
    node_major: 26
    package_manager: pnpm_11
  invariant_contract:
    runner: vitest
    property_runner: fast-check
    property_scope:
      - ordering
      - replay_and_idempotency
      - resource_conservation
      - state_machine_transitions
      - scope_and_identity_generation
  hermetic_system:
    strategy: real_local_composition_with_controlled_boundaries
    real_inside_seal:
      - filesystem
      - git_worktrees
      - production_modules
      - subprocess_adapter
    controlled:
      - clock
      - randomness
      - environment
      - process_outcomes
      - provider_results
      - github_state
      - scheduler_events
      - external_effect_acknowledgements
    simulator_style: stateful_in_process
    cassette_role: supplemental_shape_fixture_only
    memory_filesystem_role: focused_utility_only
    containers: deferred_until_a_real_database_queue_or_service_boundary_exists
    browser_projection: playwright_when_behavior_requires_browser_observation
  live_sandbox:
    driver: custom_typescript
    entry_rule: invoke_real_operon_entry_points
    controls:
      - named_disposable_target
      - explicit_authorization
      - enforced_spend_bound
      - target_identity_preflight
      - cleanup_and_evidence_deposit
    target_registry: layers.live_sandbox.targets
  eval_qualification:
    framework: custom_typescript_runner
    corpus_format: plain_git_controlled_yaml_or_json
    capabilities:
      - repeated_trials
      - deterministic_graders
      - trajectory_assertions
      - native_harness_adapters
      - judge_meta_evaluation
      - composite_artifact_scoring
    provider_campaigns: separately_authorized
  ops_hardening:
    threat_model: structured_stride_over_boundary_map
    property_and_state_fuzzing: fast-check
    contention_driver: bespoke_typescript
    accelerated_soak: fake_clock_and_scripted_providers
    production_shaped_soak: custom_typescript_sandbox_driver
    disaster_recovery: custom_crash_point_orchestrator
    secret_scanner: pinned_gitleaks
    k6: deferred_until_http_is_a_real_contention_point
  reporting:
    human: markdown
    machine: [json, junit, sarif_where_applicable]
    output_root: ./.artifacts/
  commands:
    install: pnpm -C codex-tests install --frozen-lockfile
    deterministic: pnpm -C codex-tests run test:deterministic
    sandbox: pnpm -C codex-tests run test:sandbox
    qualification: pnpm -C codex-tests run eval:qualify
    ops: pnpm -C codex-tests run test:ops
    all_local_non_spending: pnpm -C codex-tests run validate:local
  ci_host:
    selected: github_actions
    integration_status: not_authorized
    activation: future_additive_opt_in_only
    reason: >-
      An active workflow must live outside codex-tests and therefore requires
      a later explicit human decision. Local walking-skeleton commands come
      first; incumbent workflows and required gates remain unchanged.
  rejected:
    - option: borrow_root_dependency_graph
      reason: Couples the parallel-greenfield harness to incumbent dependency changes and prevents an independently locked toolchain.
    - option: node_test_with_custom_generators
      reason: Saves dependencies but creates more fixture, property-generation, and reporting code for a C3 TypeScript product.
    - option: pytest
      reason: Introduces a second implementation language without a product boundary that justifies it.
    - option: memory_filesystem_as_primary
      reason: Cannot faithfully prove path, symlink, permission, worktree, subprocess, and crash semantics.
    - option: testcontainers_as_primary
      reason: Operon currently has no database, queue, or independently versioned local service whose semantics justify container cost.
    - option: recorded_vendor_interactions_as_truth
      reason: Recorded responses become stale and cannot prove current authentication, quota, or vendor behavior.
    - option: generic_browser_e2e_as_live_driver
      reason: Browser automation does not contain or exercise GitHub, provider, scheduler, registry, and publication seams.
    - option: promptfoo
      reason: Quick for prompt matrices but less natural for native multi-step harness sessions, trajectory scoring, and composite artifacts.
    - option: hosted_eval_platform
      reason: Adds data egress, recurring cost, external authentication, and tool lock-in before shared dashboards are a demonstrated bottleneck.
    - option: k6_as_initial_scale_driver
      reason: Current contention lives in leases, journals, queues, budgets, clocks, and local processes rather than an HTTP endpoint.
    - option: local_only_permanent_gate
      reason: Useful while building but not durable enforcement; future CI activation remains required and explicitly authorized.
    - option: second_ci_host
      reason: Adds an avoidable operational and policy surface when the repository already uses GitHub.

