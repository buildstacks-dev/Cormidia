name: Dependency audit

# Supply-chain advisory lane (#402, research/2026-08-11_prompt-and-ts-posture-audit.md
# §A2.5). Deliberately SCHEDULED, never per-PR/per-push: #403 minute pressure,
# and advisories change with the registry, not with our commits. One weekly job
# (~1 minute) plus manual dispatch.
#
# Baseline discipline: the known-advisory baseline lives in
# pnpm-workspace.yaml → auditConfig.ignoreGhsas (12 entries recorded
# 2026-08-11, all transitive under the exact-pinned provider SDKs). This lane
# therefore fails only on NEW advisories. A red run is a signal to act on —
# either an upstream bump clears the advisory, or it joins the baseline with a
# named justification in that edit's PR body. Entries are removed in the same
# change as the SDK bump that clears them; never grow the baseline to silence
# a fixable advisory.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      # No install needed: pnpm audit reads the lockfile and queries the
      # registry's audit endpoint.
      - name: Audit production dependency graph (fail on new advisories)
        run: pnpm audit --prod
      - name: Audit dev graph (report-only — dev-only advisories inform, not gate)
        if: always()
        run: pnpm audit || true
