name: Core checks

# Per-commit CI lane for the replacement validation harness
# (validation-design/model/policy.yaml selects the blocking per-commit lane;
# Cormidia's workflow detector additionally pins L1, L2, and gitleaks). The lane's shape is pinned by
# tests/policy/ — removing a gate here without a policy change is a
# policy violation.
#
# RQ-1 is enforced by the separate exact-candidate release path; do not add a
# release-shaped job here or move release/publication work to self-hosted compute.
#
# Wall-clock: the 5-minute per-commit target is human-ratified (HB-007 item 13)
# as a report-only optimization target. The 15-minute job ceiling remains the
# enforced hang bound; missing 5 minutes has no verdict effect.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compute:
        description: Run this exact ref on the Mac runner or GitHub-hosted fallback
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - github-hosted
      expected_sha:
        description: Exact 40-character commit SHA the manual run must validate
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    # GitHub always orchestrates. Internal PR/main work uses the owner's
    # disposable Mac-backed runner; untrusted fork PRs and explicit recovery
    # dispatches stay on GitHub-hosted compute.
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'workflow_dispatch' && inputs.compute == 'github-hosted')) && 'ubuntu-latest' || 'cormidia-core-linux-arm64' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a drifted manual candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
      - name: Record lane start
        run: echo "LANE_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # pnpm check already includes the strict typecheck; do not execute it twice.
      - run: pnpm check
      - name: Check design-to-implementation closure
        run: pnpm validation:trace
      - run: pnpm build
      - run: pnpm test
      - name: Report wall clock (ratified 5-min target — reported, not enforced)
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - LANE_START ))
          echo "per-commit lane wall clock: ${ELAPSED}s (ratified target 300s — HB-007 item 13, report-only)"

  gitleaks:
    # Secret-hygiene lane (policy L5_ops → secret-hygiene): pinned version +
    # config, fail-closed invocation, and a generated temporary canary proving
    # the scanner can fire (skill rule 16 — a detector that has never fired is
    # an assumption). No fixture allowlists: synthetic test secrets are
    # runtime-generated, never committed (tests/README.md convention 5).
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'workflow_dispatch' && inputs.compute == 'github-hosted')) && 'ubuntu-latest' || 'cormidia-core-linux-arm64' }}
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.18.4
      GITLEAKS_SHA256_X64: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
      GITLEAKS_SHA256_ARM64: bf5f7f466ebfade1296c8bd32cf7d3f592c2aa78836aa9980ffbe2cadca7a861
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Refuse a drifted manual candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
      - name: Install pinned gitleaks (checksum-verified, fail-closed)
        run: bash scripts/ci/install-gitleaks.sh
      - name: Canary — prove the scanner fires on a planted secret
        run: |
          set -euo pipefail
          CANARY_DIR="$(mktemp -d)"
          # Generated at run time, never committed; AWS-key-shaped test value.
          CANARY_SUFFIX="$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n' | tr 'a-f' 'A-F')"
          printf 'aws_access_key_id = AKIA%s\n' \
            "${CANARY_SUFFIX}" \
            > "${CANARY_DIR}/canary.env"
          if ./gitleaks detect --no-banner --no-git --source "${CANARY_DIR}" > /dev/null 2>&1; then
            echo "NEGATIVE CONTROL FAILED: gitleaks did not fire on the planted canary — the lane cannot be trusted"
            exit 1
          fi
          echo "canary detected — scanner proven able to fire"
          rm -rf "${CANARY_DIR}"
      # Working-tree scan (--no-git): the per-commit obligation guards NEW
      # secrets landing now. Git history is immutable; its 28 findings (all
      # synthetic legacy-suite literals at pre-archive paths, classified
      # 2026-07-31) are recorded in the harness build report, not re-scanned.
      - name: Scan working tree (fail-closed)
        run: ./gitleaks detect --no-banner --redact --no-git --source . --config .gitleaks.toml
