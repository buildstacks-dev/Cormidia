phase_6_invariant_backflow:
  - id: OPERON-INV-012
    name: critical_risk_quarantine
    provenance: [stated, proposed]
    status: ratified
    ratified_on: 2026-07-29
    enforcement: [runtime_guardrail, test]
    statement: >-
      Once an unresolved critical safety incident is deterministically
      detected, Operon starts no new provider, tool, or effect action in the
      smallest safely containable scope. If the affected scope or shared
      authority cannot be trusted, containment expands to the organization.
      Read-only forensics, reconciliation, and explicitly authorized
      harm-reduction actions may continue. Resume requires an attributable
      resolution decision.
    remaining_architecture_finding: AF-014

