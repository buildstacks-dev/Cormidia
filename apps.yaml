# apps.yaml — app registry (docs/architecture.md §7). Human-ratified surface:
# changes land via proposal PR, never silent edits.
#
# One entry per target app the org operates on. `repo` (GitHub owner/repo
# slug) is the app's identity. `status` (live | paused | onboarding) is
# operational policy — "one live app at a time" is expressed here; the
# org-level WIP limit below is what code enforces. Per-app `cadence`
# overrides REPLACE that role's roles.yaml triggers when present; an empty
# list disables the role for that app, e.g.:
#   cadence:
#     support: []                          # disable support here
#     planner: [{schedule: "daily 08:00"}] # replace planner's triggers
#
# `.cormidia/config.yaml` in an app repo shares this schema, so the version
# field is carried from day one (architecture.md §1).

schema_version: 1

org:
  name: cormidia
  max_concurrent_turns: 2       # org-level WIP limit (architecture.md §2)

defaults:
  budget_usd_month: 1000        # decided 2026-07-04; configurable per app

apps:
  # Historical self-registration from the dogfood period. The Cormidia source
  # repo never doubles as the active org (docs/PURPOSE.md v1.5) — the active
  # org home's apps.yaml is authoritative; this packaged copy is a template.
  cormidia:
    repo: cormidia/Cormidia
    status: onboarding
    cadence: {}
  # Public front door (homepage, install docs, community issues, release
  # notes; never source) — self-hosting decision, docs/PURPOSE.md v2.11–v2.13.
  cormidia-web:
    repo: cormidia/cormidia-web
    status: onboarding
    budget_usd_month: 1000
    cadence: {}
  operon-sandbox-alpha:
    repo: bikramgupta/operon-sandbox-alpha
    status: live
    budget_usd_month: 1000
    cadence: {}
  cormidia-sandbox-beta:
    repo: bikramgupta/cormidia-sandbox-beta
    status: onboarding
    budget_usd_month: 1000
    cadence: {}
  operon-sandbox-gamma:
    repo: bikramgupta/operon-sandbox-gamma
    status: onboarding
    budget_usd_month: 1000
    cadence: {}
  cormidia-sandbox-delta:
    repo: bikramgupta/cormidia-sandbox-delta
    status: onboarding
    budget_usd_month: 1000
    cadence: {}
  operon-marketplace-demo:
    repo: bikramgupta/operon-marketplace-demo
    status: live
    budget_usd_month: 1000
    cadence:
      planner:
        - event: support-feedback
        - event: adoption-signal
      builder:
        - event: ticket-ready
      reviewer:
        - event: pr-opened
      sre:
        - event: health-alert
      support:
        - event: support-feedback
      marketing:
        - event: adoption-signal
        - event: launch-calendar
        - event: release-shipped
    channels:
      support:
        - fixture-helpdesk
        - fixture-email
      marketing:
        - draft-launch-note
        - fixture-adoption-report
  buildstacks.dev:
    repo: buildstacks-dev/buildstacks.dev
    status: onboarding
    budget_usd_month: 1000
    cadence: {}
    channels:
      support: []
      marketing: []
