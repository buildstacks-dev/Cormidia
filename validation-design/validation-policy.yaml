# validation-policy.yaml — Cormidia replacement harness
# This file is the contract a future validation-harness-audit diffs conformance
# against. Status: RATIFIED by the product owner 2026-07-31 (in session; record in
# ratification-package.md -> "Ratification record — 2026-07-31").
# Every decision here traces to the campaign artifacts under validation-design/.
# Tighten-only: a narrower module policy may tighten, never loosen, anything here.
# changelog 2026-07-31 (final-gate refusal): rewritten to parse as valid YAML with
# owner/trigger as separate keys; artifacts registry completed (readme, agents-md
# contribution, policy self-reference); B-17-live renamed B-17-L3; F-PT-006/007/008
# statuses corrected to open-blocked-contract.
# changelog 2026-07-31 (ratification): design_status -> ratified; release_campaign
# spend amended (24 turns / $100); F-PT-002 resolved with recorded facts;
# F-PT-003/004/007 resolved-ratified (their sentences are contract truth);
# F-PT-005 human-ratified by adoption. F-PT-006/008/009/010/011 remain open.
# changelog 2026-07-31 (harness revision): F-PT-017 records the provider terminal-
# status vocabulary conflict; F-PT-018 records that the configured GitHub plan cannot
# enforce required checks. Required target gates remain tighten-only; observed
# enforcement gaps are explicit rather than represented as green.
# changelog 2026-08-01 (owner-confirmed harness revision): register the proposed
# comparative-execution design (M16/J-19/B-18/B-19/S-8). Existing ratified gates,
# tiers, spend bounds, and tooling are unchanged. New case families are design-only;
# S-8 scores remain inadmissible under F-PT-011 until calibrated and ratified.
# changelog 2026-08-03 (owner-accepted Phase 8 implementation contract):
# register the roadmap/validation/delivery-unit/batching revision
# (M17/J-20/INV-016/B-20..22/S-10/C-OP-BATCH/C-OP-VALIDATION). Existing ratified
# gates, tiers, spend bounds, tools and blocked findings are unchanged. The owner
# accepted the exact section 10.1 decision and authorized local implementation from
# HB-100; protocol surfaces, merge, publication/deployment and live/eval/soak remain
# separately gated. Acceptance is not implementation evidence.
# changelog 2026-08-03 (HB-102 implementation): the deterministic validation-contract
# schema/catalog/lifecycle/readiness guard and exact hash lineage are executable at L1/L2.
# changelog 2026-08-03 (HB-103/HB-104/HB-105 implementation): production loop admission
# now consumes current RoadmapPlan/readiness/validation authority; delivery-unit claim,
# PR/HEAD/evidence/review/merge projections are whole-unit; bounded token-free batches
# own lazy plans, budgets, journals and outcomes; structured creator/direct authorities
# alone qualify for zero-turn normalization.
# changelog 2026-08-03 (HB-106/HB-107 implementation): complete direct campaign
# authorities bind five Reddit, one LinkedIn and one Twitter destination to one content
# turn but seven approval/acknowledgement/evidence/follow-up identities; planning and
# delivery share orchestrateEpisode; ordered immutable-prefix/unit-delta manifests,
# exact session compatibility and cache hit/miss/unknown telemetry are executable at
# L1/L2. No connector, external effect or live/eval/soak campaign ran. HB-108..111 and
# protocol ratification remain pending.
# changelog 2026-08-04 (HB-108/HB-109 machinery/HB-110): the accepted validation
# catalog now contains the complete deterministic 2026-08-03 registry and a new
# content pin; its closure walk fails on empty families or missing seeded detectors.
# Planner and Validation Designer pre-tuning corpora run as pending, unscored data
# collection and stay inconclusive under F-PT-010/011. The contention rig now covers
# overlapping batches, duplicate stimuli, atomic multi-ticket claims, mixed sibling
# settlement and stale frontiers; the soak collector records the same batch/cache/
# recovery denominators, but no seven-day campaign ran. CLI Status, Reports and Observe
# consume one read-only explanation projection. No protected protocol surface changed.
# changelog 2026-08-03 (owner decision): exact manual-review independently excludes
# autonomous Planner readiness and Builder whole-unit claim; Cormidia never removes it.
# No manual-* wildcard exists; manual-feelview is tracked only as HB-112 taxonomy audit.
# changelog 2026-08-06 (owner-resolved F-PT-024): grantless budgeted actions are
# deliberately not dollar-counted; the audit row is the record; objective grants
# remain the opt-in bound. No behavior changed — the resolution ratifies the landed
# interim and pins it with a contract test.
# changelog 2026-08-06 (#296 PR D, §5.3 headline split landed): external-publishing
# is replaced by repo-collaboration (budgeted — reachable ONLY after the composed
# gate verifies the target is the app's own configured repository: explicit slug
# match or the workdir's real git origin; failures refine to the human-only
# repo-collaboration-foreign disposition rule and the raised item carries THAT
# rule), package-publish, release-artifact (incl. git tag creation; listing stays
# routine), and outbound-message (all human-only). The refinement runs BEFORE grant
# matching, so no standing grant is ever consulted under the budgeted name for a
# foreign target. Retired name tombstoned human-only. ACTION_IDENTITY_VERSION
# bumped 6->7. All four ratified splits are now landed; F-PT-024 (grantless
# budgeted quantum) remains the one open successor finding.
# changelog 2026-08-06 (#296 PR C, §5.4 refinement landed): outbound-network now
# classifies by DESTINATION: undeterminable destinations (variables, substitutions,
# backticks, ${IFS}, config-file/piped/interpolated forms) fail closed to the new
# human-only outbound-network-undeterminable class; determinable hosts keep the
# grantable tier; hosts on the app's configured allowlist (apps.yaml
# network_allowlist, org default + per-app override, ratified default trio
# registry.npmjs.org/api.github.com/github.com) ride the budgeted tier at the
# composed gate with per-action audit rows (grantless quantum: F-PT-024).
# ACTION_IDENTITY_VERSION bumped 5->6 (in-flight grants cancel at landing).
# changelog 2026-08-06 (#296 PR B, §5.2 split landed): secrets-or-auth is replaced by
# secret-mutate (HO, tightened) and secret-read (grantable, the bucket's former tier);
# the repo-local .npmrc/.netrc scrub is retained verbatim, the retired name keeps a
# grantable tombstone, exfiltration remains independently closed by outbound-network
# (CF-SPLIT-SECRETS pairing control), and F-PT-019's operation-aware contract truth
# carries to the read side with its CF-REG-204 implementation leg still parked.
# ACTION_IDENTITY_VERSION bumped 4->5 (in-flight grants cancel at landing).
# changelog 2026-08-06 (#296 PR A, §5.1 split landed): destructive-or-irreversible is
# replaced by destructive-remote-data (HO), history-rewrite-owned (budgeted, op/<issue>
# namespace only), history-rewrite-foreign (HO), destructive-local (grantable), and
# gh-api-unrecognized (HO); the retired name keeps a grantable tombstone for stale
# items. ACTION_IDENTITY_VERSION bumped 3->4 (in-flight grants cancel at landing, owner
# decision 5). The ratified budgeted tier proceeds at the composed gate with a
# per-action audit row; F-PT-024 opened for the grantless budgeted accounting quantum
# (debit amount and hard bound before turn-spend wiring exists) — interim is
# audit-only visibility, with the bare defaultGate still denying budgeted actions.
# changelog 2026-08-06 (owner-ratified F-PT-023 resolution + harness revision): the
# product owner answered the Stage 4 decision request with an unqualified YES on #296
# (ratification record, 2026-08-06) — all four §5.1–5.4 consequence splits ratified in
# one decision. The harness revision (validation-harness-design, harness-revision mode,
# existing artifacts as baseline) registered: revised CORMIDIA-INV-003 (disposition
# form + third grant shape), B-09b objective-grant/disposition clauses, boundary-map
# B-09b extension, and the four CF-SPLIT-* families un-parked into case-catalog §10.1.
# Implementation follows one rule per PR (destructive, secrets, network, publishing
# last), each red-then-green with an ACTION_IDENTITY_VERSION bump cancelling in-flight
# grants at landing. Spend bounds and thresholds unchanged.
# changelog 2026-08-06 (#296 Stage 4): F-PT-023 opened — the four §5.1–5.4
# consequence-split reclassifications are a structural change (they replace the
# invariant "critical operations require human approval" with "operations require
# the disposition their consequence class specifies") and a partial loosening, so
# they stop for owner ratification per the implementation plan. Dependent split
# case families are parked BLOCKED:F-PT-023 in case-catalog.md; the ratification
# package with compensating controls and designed-not-implemented seeded negative
# controls is docs/approvals/consequence-split-ratification.md. No gate, tier,
# spend bound, or threshold changed by opening this finding.
# changelog 2026-08-07 (#336 harness revision, adapter-expansion boundaries): the
# validation-harness-design skill re-entered in harness-revision mode (existing
# artifacts as baseline; attributable human instruction = issue #336; elicitation
# input = owner text in #330/#337-#340 and their field-verification comments)
# registered B-23 OpenCode, B-24 Cursor, B-25 Grok Build (ACP), and B-26 Muse Code
# as provider boundaries of the B-02/03/04 class: contracts CORMIDIA-C-B23-001..
# CORMIDIA-C-B26-001 (deltas over CORMIDIA-C-CORE-001), CF-B23..26-* families plus
# CF-B23..26-L3 certification obligations (docs/harness/adding-updating.md section 5;
# certification never equals qualification, L4Q unchanged). All four are DESIGN-ONLY
# until their adapters land (#337-#340); CF-B25-L3 is additionally conditional on the
# #339 human risk review and sandbox-repo-only until it clears. Findings
# F-PT-025..028 opened for the four gate-seam ambiguities; mechanism-level cells
# parked BLOCKED:<finding>. No existing gate, tier, lane, spend bound, threshold, or
# golden set changed (tighten-only preserved).
# changelog 2026-08-05 (owner-ratified F-PT-022 resolution): L4 per-case
# token_reservation, campaign max_tokens, and observed_tokens count output tokens only,
# consistent with PURPOSE's 2026-07-20 retirement of input-token admission ceilings.
# Input/cache usage remains evidence and equivalent-USD input; unknown usage debits the
# reservation, while a known output overrun preserves exact evidence and debits actual
# output against the authorized campaign envelope. Golden token_reservation values
# remain the human-reviewed baseline. A content-bound human-approved release config may
# raise effective per-case output reservations, but must name every selected case
# exactly once, may not go below any golden baseline, and must set max_tokens to the
# exact effective-reservation sum. The #300 successor calibration is DAG=5,700,
# REPAIR=6,600, BATCH-LURE=8,700, DIRECT-PROMOTION=12,100, ROUTINE=8,000,
# CROSS-TICKET=9,500, and STRUCTURAL=4,700; all other cases retain their baseline,
# producing an 88,100-output-token full-corpus envelope.

