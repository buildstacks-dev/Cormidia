name: Efficiency qualification

on:
  push:
    branches: [main]
    tags: ["v*", "release-*"]
  pull_request:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the release attestation can resolve the qualified
          # candidate commit (see scripts/eval/release-attestation.ts). Without
          # it the default shallow checkout (depth 1) leaves the candidate commit
          # absent and the verifier now fails closed (ROOT-001).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm eval:validate
      - run: pnpm test:transformation
      - run: pnpm eval:deterministic
      - run: pnpm exec vitest run --maxWorkers=2 --testTimeout=15000
      - run: pnpm typecheck
      - name: Nightly deterministic flake tripwire
        if: github.event_name == 'schedule'
        run: pnpm eval:deterministic:nightly
      - name: Strict current Phase 6 gate
        run: pnpm test:transformation:strict

  # Release product-CURRENCY gate (P0-07 / ROOT-001 integrity/currency separation,
  # docs/PURPOSE.md 2026-07-17). The `deterministic` job above proves evidence
  # INTEGRITY on every push/PR and is honest-green whenever the committed evidence
  # is intact. This job proves the LIVE product still hashes to the qualified pin
  # (product-CURRENCY) and fails closed when it does not. It is deliberately gated
  # to release tags and manual dispatch — NOT ordinary push/PR — so per-commit CI
  # is not permanently red after a legitimate src change; a release from
  # post-Wave-5 main is expected to be RED here until a fresh qualification
  # campaign re-attests. This is where a moved/fabricated product is refused.
  release-currency:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the release attestation's changed-path check can
          # resolve the qualified candidate commit and fail closed on its absence.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Release product-currency gate (fail-closed)
        run: pnpm eval:release-verify
