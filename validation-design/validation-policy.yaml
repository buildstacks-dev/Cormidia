  - {id: F-PT-033, status: open-blocked-contract,
     subject: "S-3 verdict-marker refusal semantics + vocabulary: corpus clause said 'exactly one structured VERDICT: APPROVE|REJECT marker; parser refuses zero/two' (llm-eval-plan.md §2 S-3, HB-005(d)); the running parser (src/loop/verdicts.ts extractKeywordValueStrict, which cites that clause) deliberately parses duplicate IDENTICAL markers ('restating the same value twice is unambiguous') and refuses only DISTINCT conflicting values, with keyword precedence (first matching keyword consulted: Verdict over Status); production vocabulary is approve|findings (docs/loop/design.md section 6), not APPROVE|REJECT; and the fourth accepted bare-line form ('Status: done' / 'Verdict: approve') is a code+template addition beyond design.md section 6's three status formats. Undecided: is duplicate-identical tolerance contract truth (ratify the code's reading) or over-leniency (tighten the parser)? The landed tests (tests/unit/s3-verdict-marker.test.ts) record current implementation behavior - duplicate-identical parses, Verdict-before-Status precedence - as pinned regression facts conferring NO ratification; no NEW test may encode either answer as contract truth, and the strict reading would require changing the parser and those tests, red-then-green whichever way the owner decides (the F-PT-012 pattern: ratified prose vs deliberate code design)"}
  # F-PT-034/035/036 opened 2026-08-12 from the HB-142/143/150 pre-implementation
