layers:                                      # the audit's diff surface
  L1_invariant_contract:
    status: "implemented through backlog Wave 4; full-gate evidence recorded in harness-design-state.md"
    cadence: every_commit
    runner: "vitest + fast-check (bounded deterministic seeds)"
    content: "invariant guardrail tests, contract clause tests, LLM contract layer, trajectory pass/fail assertions (ratified grounds only)"
  L2_hermetic:
    status: "implemented through backlog Wave 4, including CF-OPS-CONT's hermetic L5 rig"
    cadence: every_commit
    fixtures: "owned in-process fakes (GitHub double, fake App Server JSON-RPC, mocked adapters, fake clock, kill-point process harness) plus real temp git repos/worktrees/org+state homes; mock across boundaries, never inside"
    conformance_pairs: "same suite runs against fake and real dependency (drift guard)"
  L3_live_sandbox:
    status: "runner/profile implemented; no authorized live campaign executed in this change"
    runner: "separate opt-in vitest live config; CORMIDIA_LIVE=1 + absolute reviewed authorization file; checked-out HEAD and canonical tracked policy blob must match the authorized commit"
    obligations:
      - id: CF-B01-L3            # GitHub smoke
        target: "sandbox repos (apps.yaml sandbox class)"
        trigger: "merge/review/branch/auth code changes; release"
      - id: CF-B02-L3
        target: "real Anthropic adapter"
        trigger: "adapter/gate-hook/session/usage/auth code changes; release"
      - id: CF-B03-L3
        target: "real Codex App Server"
        trigger: "adapter/gate-hook/session/usage/auth code changes; release"
      - id: CF-B04-L3
        target: "real pi session (real denied forbidden attempt required)"
        trigger: "adapter/gate-hook/session/usage/auth code changes; release"
      - id: CF-J16-A             # launchd lifecycle proof (launchd only; systemd when droplet supported)
        target: "uniquely identifiable test definition on the real host"
        trigger: "install/upgrade; release when definition/identity/loading changes; material host/macOS change"
      - id: CF-J18-A             # unattended sandbox campaign
        target: "sandbox org + sandbox repos under the test-mode profile (below)"
        trigger: "release qualification"
      - id: B-17-L3
        status: BLOCKED
        reason: "no disposable real non-GitHub deploy/publication target exists"
        unblock: "a sandbox app declares a real, disposable release: target"
        note: "no green L3 claim follows from this status"
    spend_policy:                            # human-ratified 2026-07-31 (release ceiling amended at ratification)
      pre_merge_adapter_campaign:
        scope: "changed adapter only"
        max_provider_turns: 2
        max_equiv_usd: 5
      release_campaign:
        scope: "all adapters + GitHub + unattended profile"
        # ratification 2026-07-31: raised from 6 turns / $15 at the owner's direction —
        # "I don't want the test to be stopped just because of some repeat things";
        # retries/repeat turns must not abort a campaign. The ceiling remains a hard
        # bound, raisable only by a human policy edit.
        max_provider_turns: 24
        max_equiv_usd: 100
      on_ceiling_exhaustion: "completeness=incomplete; verdict per verdict_semantics (never pass)"
  L4_eval:
    status: "data-collection runner integrates Reviewer, Planner and Validation Designer corpora; their current references were human-validated by bikramgupta on 2026-08-04; S-8 selection-judge remains design-only and all quality thresholds remain unratified"
    runner: "hand-rolled per-tuple runner over golden-sets/ (plain files in git); CORMIDIA_EVAL=1 + absolute reviewed authorization file; HEAD, canonical policy, and every golden input must be tracked and byte-identical at the authorized commit"
    sites: "S-1..S-10 per llm-eval-plan.md; S-8 remains registered design-only; the current S-1/S-3/S-10 cases are human-validated, while threshold-dependent outcomes remain inconclusive under F-PT-009/010/011"
    decision_status_rule: >
      No PROPOSED/hypothesis threshold yields pass or fail. Until the owning finding
      (F-PT-009/010/011) ratifies, campaigns run in data-collection mode and report
      inconclusive for every threshold-dependent outcome. Judge scores (S-3, S-7, S-8)
      are inadmissible until their calibration sets exist AND thresholds ratify.
    cadence: "per-site prompt/model/instruction change; release qualification; nightly rotating shards (when scheduled validation exists); output-token ceiling declared per campaign; partial evidence preserved"
  L5_ops:
    status: "future assurance: batch-aware contention rig + extended soak collector implemented; real seven-day evidence pending and was not started; human threat model pending; abuse lane blocked; none is inside the RQ-1 release denominator"
    obligations:
      - id: CF-OPS-CONT          # contention (L5 by question; hermetic rig)
        implementation_status: "implemented; deterministic rig green"
        design: ">=10 due candidates, >=3 apps, duplicate (app,role) stimuli, simultaneous terminal settlement; six proof obligations (risk-allocation section 6)"
        owner: human
        trigger: "pre-GA; repeat on material scheduler/locking/execution-batch admission or unit-claim change"
      - id: CF-OPS-SOAK          # 7-day laptop soak, owner-ratified
        implementation_status: "resumable collector implemented; human-started seven-day campaign not run"
        design: "7 calendar days ordinary laptop use, >=3 sleep/wake cycles (1 overnight), sandbox only, 15 USD ceiling; inspection list per risk-allocation section 6"
        owner: human
        trigger: "initial autonomous qualification; repeat on material scheduler/locking/settlement/retention/session-reuse/execution-batch shape change"
      - id: CF-OPS-ROT           # Codex natural rotation sub-obligation (own evidence)
        parent: CF-OPS-SOAK
        implementation_status: "collector implemented; natural live evidence not observed"
        rule: "no natural rotation observed => completeness=incomplete, never assumed covered"
      - id: threat-model         # owner-ratified scope + timing; human-confirmed 2026-07-31
        design: "STRIDE-style pass over boundary-map; scope = trust boundaries behind all C3 control points (ten surfaces, risk-allocation section 6)"
        owner: human
        note: "human-authored future L5 assurance; absence remains disclosed and never pass, but does not block RQ-1"
        implementation_status: "ten-surface template + hash-bound admission gate implemented; status awaiting_human_author"
        due_before_earliest_of: [droplet_migration, first_non_sandbox_production_onboarding]
        review_trigger: "material trust-boundary/deployment-shape/adapter-capability/reachable-surface change"
      - id: secret-hygiene
        design: "gitleaks in CI - pinned version+config, fail-closed invocation, generated temporary canary proving detection, no broad fixture allowlists"
        owner: human
        cadence: every_ci_run
      - id: abuse-lane
        status: "deferred_declared (behind ratified threat model)"
        implementation_status: "fail-closed admission gate implemented; no cases authored before human threat model"
        interim_floor: "INV-001/002/011/015 adversarial families"
      - id: CF-OPS-COMP
        status: "not_applicable_v1"
        implementation_status: "design-only; no L5 runner owed for explicit sequential V1"
        rule: "automatic sampling or parallel candidate execution must re-enter risk allocation and may create a bounded L5 contention/cost obligation"

verdict_semantics:                           # owner-ratified
  completeness: [complete, incomplete]
  verdict: [pass, fail, inconclusive]
  rules:
    - "proven violation => fail even with missing runs"
    - "otherwise incomplete => inconclusive"
    - "incomplete never produces pass; not a fourth verdict"

unattended_test_mode_profile:                # canonical definition (B-09b cross-ref)
  status: "human-ratified and implemented in Cormidia; live CF-J18-A campaign evidence pending human initiation"
  applies_to: "sandbox orgs only"
  effect: "the allowed validation path requires zero human approval decisions (designed auto-grant categories, e.g. budget-tier items, within the profile)"
  prohibitions:
    - "never forge human decisions under a robot identity"
    - "external publication remains hard-gated"
    - "any non-sandbox repo/effect remains hard-gated"
  evidence_required: [profile_identity, sandbox_target, permitted_auto_grant_categories, zero_human_decision_rows]
  provenance: "[doc: PURPOSE v2.9] + [rambling] + owner rulings"

release_gating:
  status: active_fail_closed
  contract_id: RQ-1
  proposal: release-evidence-gate-revision-proposal.md
  qualification_values: [qualified, not_qualified, needs_human_disposition]
  activation_requires:
    - human_ratification_of_exact_protected_diff
    - implementation_audit_I2_green
    - resolved_tag_approval_authenticity_F-PT-021
  rules:
    - deterministic_first
    - immutable_pre_spend_manifest
    - subject_and_producer_currency
    - paired_site_and_exact_pairing_evidence
    - uncalibrated_judge_advisory_only
    - evidence_only_descendant_equivalence
    - separate_human_eval_debt_disposition
    - separate_exact_human_release_approval
    - github_actor_equals_approval_identity_equals_configured_release_approver
    - no_green_by_absence
  future_assurance_outside_rq1:
    - human_authored_and_human_reviewed_TM-01_through_TM-10
    - HB-073_abuse_cases_with_seeded_negative_controls
    - complete_pass_seven_day_L5_soak_with_natural_credential_rotation
  future_assurance_rule: "absence remains disclosed and never pass, but does not affect RQ-1 completeness, verdict, or qualification"
  release_candidate_equivalence:
    allowed_changed_path: "release-evidence/<version>/<qualification_id>/**"
    require_identical: [package_version, packed_file_manifest, tarball_sha256,
      tarball_sha512, package_subject, dependency_lock, prompts, roles, pipelines,
      policy, golden_sets, assignments]
  current_l4_release_sites: [reviewer, planner, validation-designer]
  l4_numeric_ceiling: "per immutable human authorization; no global value ratified"
  b17_live_status: "future assurance for generic non-GitHub external targets; not an RQ-1 npm-release obligation"
  merge_enforcement: "KNOWN-LIMITATION:F-PT-018; protected human merge plus release-blocking exact-tag rerun"
  approval_authentication:
    configured_path: ".cormidia/config.yaml#/apps/Cormidia/release/approvers"
    rule: "GitHub tag-push actor == approval.approved_by == one configured approver"
    mismatch: "refuse before npm authentication"
    local_approval_store_proof: "not additionally required"

ci:
  host: github-actions
  per_commit: [L1, L2, gitleaks]
  per_commit_gate_class: "blocking - required target: the per-commit lane (L1, L2, gitleaks) must be a required check; a red or incomplete lane blocks merge; fail-closed"
  per_commit_enforcement_status: "BLOCKED:F-PT-018 - workflow runs on pull requests and main pushes, but this private repository's current GitHub plan does not provide branch protection/rulesets; a red lane therefore cannot presently block merge"
  gate_classes: "no advisory or waived gates exist in this design; triggered lanes (L3/L4/L5) gate their own layer's claims per the per-layer expansion-gate rule, never merge"
  # changelog 2026-07-31 (audit AUD-103): blocking/advisory/waived classification was undeclared; declared here (fail-closed default made explicit)
  per_commit_wall_clock_target: "5 minutes - human-ratified 2026-07-31 as a reported optimization target only; no verdict or completeness effect (15 minutes is the core-job ceiling)"
  triggered: "L3 per obligations above; L4 per site cadence; L5 per obligations"
  rule: "trigger conditions live in CI config AND in this file - removing a gate in CI without a policy change is a policy violation"

tooling:
  selected: [vitest, fast-check, owned-in-process-fakes-plus-real-temp-git,
    vitest-live-config, hand-rolled-eval-runner, stride-threat-model-doc,
    bespoke-contention-rig, soak-protocol, gitleaks-pinned, github-actions]
  rejected:
    - option: jest
      reason: "no advantage over vitest; older ESM story"
    - option: testcontainers
      reason: "no DB/queue boundary; Docker dependency on laptop-first workflow"
    - option: vcr-cassettes
      reason: "silently stale; cannot script failure modes"
    - option: promptfoo
      reason: "fights per-pairing/severity aggregation and the decision-status rule; second framework surface"
    - option: hosted-eval-platforms
      reason: "data leaves the box; recurring cost; auth surface; anti-local-first"
  revision_2026_08_03:
    status: owner_confirmed_phase_7
    decision: "reuse the selected stack; no new framework, service, database, queue, cassette system or hosted evaluator"
    added_fixture_obligations:
      - "deterministic 100+ issue backlog and bounded-delta generators"
      - "versioned RoadmapPlan, validation-contract, direct-work and execution-batch fixtures"
      - "scripted provider cache-hit/cache-miss/cache-unknown and session-resume evidence"
      - "kill-point and contention schedules across unit admission, lazy EpisodePlan creation and per-unit terminal disposition"
    quality_scaffolds: [golden-sets/planner, golden-sets/validation-designer]

