verdict_semantics:                           # owner-ratified
  completeness: [complete, incomplete]
  verdict: [pass, fail, inconclusive]
  rules:
    - "proven violation => fail even with missing runs"
    - "otherwise incomplete => inconclusive"
    - "incomplete never produces pass; not a fourth verdict"
  # Added 2026-08-07 for scored lanes (L-ACC). This is a THIRD FIELD, not a fourth
  # verdict: completeness and verdict keep exactly the meanings above. It lives here
  # rather than in a runner so `ungraded` semantics are policy, not discretion
  # (CORMIDIA-INV-ACC-5, ratified rubric §5).
  axis_score:
    values: [0, 1, 2, 3, ungraded]
    rules:
      - "0/1/2/3 = absent / attempted / adequate / strong, per acceptance/rubric.md §5"
      - "every numeric score carries a mandatory one-sentence justification citing specific evidence; a score without its citation is DISCARDED and the axis reports ungraded"
      - "ungraded means the evidence for this axis is missing or unusable; it is NOT 0 and is never coerced to 0"
      - "ungraded never enters an aggregate as a numeric value; every aggregate names its graded denominator explicitly"
      - "an axis with no legal disjoint grader reports ungraded; it is never graded by a correlated provider (CORMIDIA-INV-ACC-2)"
      - "any ungraded axis, killed scenario, ceiling exhaustion, or missing grader run => completeness: incomplete for that scenario"
      - "while a threshold is unratified, every threshold-dependent axis verdict is inconclusive — never pass, never fail"
    thresholds: "NONE. acceptance/rubric.md §5 (human-ratified 2026-08-07) declares no threshold in v0; they are ratified separately from the FIRST GRADED distribution a campaign produces (run 1 terminated at the plan gate entirely ungraded, so that trigger remains unmet — clarified 2026-08-10, reader test 9 / gate follow-up; the deferral itself is unchanged). A RATIFIED DEFERRAL, not an open finding — no F-PT id is owed and none may be minted for it, and no threshold may be introduced anywhere else."

l_acc_lane:                                  # outcome acceptance — registered 2026-08-07, RUN 1 TERMINAL 2026-08-08
  status: "guardrails, runner and execution layer implemented (HB-120..HB-132). Run 1 exercised packaged cormidia@0.1.1 from tarball sha256:e2eb2650156d65158242f783560f0eaaa0837ae805b751890ef10f9cb772183a at commit e52b304ac8f6a00be973e265b84af8533c59dd72 and stopped at the unchanged rubric section 6 plan gate. Its official distribution is entirely ungraded/inconclusive, all three scenarios are incomplete, and release_signal is null; acceptance/run-1-result.md indexes the immutable report. No rubric axis, golden set, plan gate or threshold changed; every threshold-dependent verdict remains inconclusive and L-ACC remains outside RQ-1."
  question: "did the org produce good work from realistic input — the gap tests/live/ (boundary conformance) and the unbuilt L-JOB-LIVE leave open"
  why_not_L3: "L3's verdict algebra is deterministic pass/fail against boundary clauses; L-ACC's is multi-axis scored with inconclusive as the default state. Folding them would force either weakening L3's pass semantics or reporting a score as a clause."
  rubric: "../acceptance/rubric.md — HUMAN-RATIFIED 2026-08-07, TIGHTEN-ONLY. Narrow an axis or a rule if you must; never loosen one, and never introduce a threshold."
  journeys: [J-21, J-23]
  boundaries: [B-27, B-28, B-29]
  contracts: [CORMIDIA-C-B27-001, CORMIDIA-C-B28-001, CORMIDIA-C-B29-001]
  llm_sites: [S-11]
  case_families: [CF-ACC-S1, CF-ACC-S2, CF-ACC-S3, CF-ACC-GATE]
  scenarios:
    - {id: S-ACC-1, kind: app, arm: "plan + build", closes: "greenfield baseline"}
    - {id: S-ACC-2, kind: app, arm: "plan + build", closes: "brownfield corpus refresh — the highest-value app scenario"}
    - {id: S-ACC-3, kind: job, arm: "single (jobs have no Planner)", closes: "L-JOB-LIVE debt, docs/jobs/design.md §14"}
  guardrails_are_not_lane_work: >
    CORMIDIA-INV-ACC-1..7b are mechanical and land at L1/L2 with negative controls
    (case-catalog §3.1). Only the rubric's scored axes are lane rows (case-catalog §8b).
    The expensive lane contains only what no cheaper layer can falsify.
  spend:
    bound: "per immutable human authorization for that exact campaign (output-token ceiling + equivalent-USD ceiling in the campaign config, B-27 §1.7)"
    global_ceiling: "none ratified — deliberately, exactly as l4_numeric_ceiling records for L4; the §5 adapter/release numbers bound conformance smokes and must not be stretched to cover a build campaign"
    structural_bounds: ["the plan gate spends a fraction of the envelope and often ends the campaign",
                        "deployment is unreachable — the campaign holds no deploy grant at any moment",
                        "triggered by explicit human authorization only; never scheduled, never casual"]
    on_ceiling_exhaustion: "completeness=incomplete for the affected scenario; verdict per verdict_semantics (never pass)"
  preflight_refusals:                        # B-27 §1 — all pre-mutation, pre-spend
    - "pnpm install:packaged --replace-source-links unrun, skipped, stale vs the commit pin, or non-zero (CORMIDIA-INV-ACC-7b; assert its exit status, do not reimplement its checks)"
    - "effort: max on any harness but claude/opencode (src/runtime/assignment.ts:82)"
    - "an app arm whose planner, builder and reviewer are one provider family (the builder != reviewer collapse AGENTS.md forbids)"
    - "an adaptive_assignments candidate with neither a real qualification_ref nor an explicit uncertified disclosure"
    - "commit pin != checked-out HEAD, untracked canonical policy blob, or a scenario repository resolving to this repository (CORMIDIA-INV-ACC-3)"
    - "unattended execution with no declared plan-gate policy (silence is not consent; an auto-continue policy is legal since F-PT-030 resolved 2026-08-07, an undeclared one never is)"
  hard_boundaries:
    - "no deployment: a campaign ends buildable with a preview command in the report; hosting is a separate human approval afterwards"
    - "never Cormidia itself as a sandbox app: Cormidia feature work is a campaign OUTPUT (filed issues), never a step inside it"
    - "no green by absence: ceiling exhaustion, skipped scenario, missing grader run, or unratified threshold => incomplete/inconclusive"
    - "grader != builder, enforced in code per axis, not by convention"
    - "real human approvals only; unattended runs use exactly the ratified sandbox test-mode profile"
    - "all campaign work runs through the PACKAGED cormidia and cormidia-job binaries"
  rq1_relationship: "F-PT-029 RESOLVED-RATIFIED 2026-08-07 — NO BLOCKER. L-ACC never gates a release and never enters RQ-1 completeness, verdict, or qualification; it is disclosed assurance outside RQ-1, like the soak and the threat model. A bad result is information for the human, never a mechanical block."
  plan_gate_authority: "F-PT-030 RESOLVED-RATIFIED 2026-08-07 — an unattended campaign MAY auto-continue past the plan gate via the campaign config's declared plan_gate policy, so a campaign runs end to end. Unchanged: the ratified rubric §6 criteria still decide (build arm proceeds only when every scenario reached at least `attempted` on P-1 and P-5), the resolution is still recorded durably before any build-arm spend, the envelope still bounds spend, and approvals still run under the sandbox test-mode profile. A config with no declared plan_gate policy still refuses — silence is not consent."

