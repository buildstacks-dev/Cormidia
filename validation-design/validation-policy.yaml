     resolution: "owner decision 2026-08-12 (attributable decision recorded in the landing PR body): EXACTLY ONE FIRING PER REAL-WORLD EVENT — duplicate deliveries of the same event collapse to one. The dedup identity is CONTENT-DERIVED (sha256 over the canonical sorted-key serialization of the producer's payload), never the delivery filename and never a producer-supplied id. Rationale, recorded at the owner's instruction: a producer-supplied id double-fires the moment a retrying producer mints a fresh one, and reusing an id with different bytes recreates the very same-identity-two-payloads ambiguity this contract could not resolve; content derivation collapses duplicate delivery by construction AND makes the second clause vacuous — payloads that differ ARE different events, so no resolution rule is needed. This follows the incident idempotency-key precedent (src/org/standing-roles.ts queueIncidentFiling mints `incident:<sha256(app\\0key\\0payloadHash)>`), which already keeps a remote effect at-most-once from content rather than from a supplied id. PRODUCER ATOMICITY IS NOT REQUIRED: a partial file fails JSON parse and is retained loudly as `malformed_company_event` for repair (already the behavior), then fires exactly once under its content identity when the complete bytes land — the dispatcher-tolerated-partial-file branch, made safe by content identity rather than by a producer obligation Cormidia cannot enforce. Migration: a legacy filename entry in consumed.json still suppresses its own file, so nothing already consumed re-fires; suppression only widens, which is tighten-only. Implementation owed under HB-P3 (product change + detectors, red-then-green)",
     implemented: "2026-08-12 HB-P3: src/org/events.ts mints the content identity (inboxEventKey — sha256 over stableJson of the payload with the transport-only filename stripped) and readInbox collapses same-identity deliveries within a sweep while still honoring legacy filename marks; src/org/dispatch.ts reports each collapse as a duplicate_delivery skip so a double-delivering producer stays operator-visible (INV-008). Detectors: tests/hermetic/cf-b13-cf-j10-i-.../cf-b13-content-identity.test.ts — four ratified clauses each with a seeded control (filename identity fires twice; a producer-supplied id loses an event; ignoring the legacy mark re-fires a consumed event), red-then-green verified by reverting the identity line and observing clauses 1 and 3 go red. The pre-existing CF-J10/CF-SM-EVENT/CF-INV-014/CF-J09-S consumption assertions were restated on the ratified identity, never weakened"}
  - {id: F-PT-007, status: resolved-ratified, resolved: 2026-07-31, subject: "bootstrap concurrent-edit outcome",
