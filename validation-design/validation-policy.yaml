case_sourcing:
  # SINGLE SOURCE OF TRUTH for the detector-deposit rule (other files reference this block).
  - "acceptance criteria land with every feature (contracts/journey-acceptance.md format)"
  - "adversarial derivation from invariants as the system evolves"
  - "every production bug deposits its regression detector in the same change; every bad LLM output in prod becomes a golden case (non-negotiable)"
  - "the same change records the defect's traceability row in case-catalog.md section 10.3 (the defect register — not the 10.1/10.2 ratified-revision tables) and regenerates case-catalog.yaml (tightened 2026-08-10, Phase 8 reader test; subsection precision added reader test 8 — this block is the single source of truth and must carry the same precision the routing doc does); a structural-shaped defect re-enters harness-revision instead of being force-fit into a row"
  - "evidence-deposit rule: deterministic defects found at L3/L4 deposit L1/L2 detectors in the same change"
  - "structural mismatch => re-enter validation-harness-design in harness-revision mode; never pile cases onto a wrong shape"

harness_self_tests:                          # skill rules 16-17
  - "every detector family lands red-then-green against a seeded violation (negative control)"
  - "fixtures get self-tests; sweeps assert non-empty walks; policy loader, CI config, and registry surfaces pinned by tests"
  - "gitleaks canary proves the scanner can fire"

