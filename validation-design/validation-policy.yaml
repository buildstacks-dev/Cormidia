  # Opened 2026-08-01 during the #202-#213 fix campaign (procedure: agents-md-contribution.md).
  - {id: F-PT-019, status: resolved-ratified, resolved: 2026-08-03, subject: "secrets-or-auth is operation-blind: a metadata-only query that never opens the file (git check-ignore .env, git status --ignored -- .env.example) matches the same pure-text rule as a genuine contents read (cat .env). #204 shows the false-positive cost (a blocked promotion, and an approval queue the human learns to rubber-stamp); narrowing the rule would also loosen it for real exfiltration reads. Owner must decide whether the rule becomes operation-aware and, if so, which git subcommands count as contents reads",
     resolution: "contract truth (PURPOSE v2.15): secrets-or-auth is operation-aware and fails closed. It classifies on whether an action actually emits file contents, not on text alone; any command whose effect cannot be parsed is treated as critical. The two error directions are not symmetric per system-map.md 5.2 — a real critical effect classified routine is authority damage, a false positive is only availability damage — so the fail-closed default on unparsed effects is part of the contract. Coverage must also reach effects that bypass the gate entirely rather than merely evading a pattern (#20)"}
  - {id: F-PT-020, status: resolved-ratified, resolved: 2026-08-03, subject: "undecided approval items have no documented lifetime: approvals/design.md specifies TTL and expiry for GRANTS (post-decision) but says nothing about a pending item whose raising turn has ended. #205 shows the cost — 7 of 7 items in the august-org run outlived their turns, and app verify treats any pending item as a promotion blocker, so the queue grows monotonically under the scheduler and permanently blocks promotion. Deciding it means adding a terminal non-blocking state to the ratified approval state machine (CF-SM-APPR) and changing what app verify counts; adjacent to F-PT-008. Owner decision required",
     resolution: "contract truth (PURPOSE v2.15): a gate denial suspends the raising turn, so an approval is raised synchronously and cannot outlive its turn. CF-SM-APPR gains a terminal non-blocking 'expired' state reached after a TTL (default 24h, matching the grant TTL, resolved through policy configuration not a source constant). On expiry the turn's durable artifacts and worktree are preserved, its claim is released, the turn resolves as blocked rather than failed and consumes no failure claim (#104), and the item leaves the pending queue for an audit view. cormidia app verify counts only approvals whose raising turn is still live. F-PT-008 is adjacent but NOT resolved: it concerns an item whose grant expires after a decision, not an item never decided"}
  - {id: F-PT-018, status: open-known-limitation, subject: "the current private-repository GitHub plan cannot enable branch protection/rulesets; protected human merge and exact-tag rerun are the ratified bounded mechanism, without claiming mechanical merge blocking"}
  - {id: F-PT-021, status: resolved-ratified, resolved: 2026-08-04, subject: "RQ-1 tag approval authenticity",
     resolution: "publication requires exact equality among the GitHub-authenticated tag-push actor, approval.approved_by, and one app-configured release approver; mismatch refuses before npm authentication. Remote proof of the local ApprovalStore path is not additionally required"}
  - {id: F-PT-022, status: resolved-ratified, resolved: 2026-08-05, subject: "L4 token accounting: whether per-case reservations and campaign max_tokens count output tokens only, uncached input plus output, or every vendor-reported input/cache-create/cache-read/output token; and how a known actual overrun settles against the authorized envelope",
     resolution: "contract truth: per-case reservations, campaign max_tokens, and observed_tokens count output tokens only, consistent with PURPOSE's retirement of input-token ceilings. Input/cache usage remains preserved telemetry and contributes to equivalent-USD accounting, but never debits the token envelope. Unknown-use failures conservatively debit the effective output reservation. Known results debit exact output; an output overrun is preserved, remains incomplete/inconclusive, and continues independent cases only while the authorized campaign envelopes admit them. Golden token_reservation values remain human-reviewed baselines. A content-bound human-approved release config may raise effective reservations only by naming every selected case exactly once, never lowering a baseline, and binding max_tokens to their exact sum. For #300, two times each observed overrun rounded up to 100 gives DAG=5,700, REPAIR=6,600, BATCH-LURE=8,700, DIRECT-PROMOTION=12,100, ROUTINE=8,000, CROSS-TICKET=9,500, and STRUCTURAL=4,700; unaffected cases retain baseline values and the effective full-corpus sum is 88,100."}
  # Opened 2026-08-06 at #296 PR A; resolved by the owner the same day.
  - {id: F-PT-024, status: resolved-ratified, resolved: 2026-08-06, subject: "grantless budgeted-tier accounting",
     resolution: "owner decision (#296, 2026-08-06): grantless budgeted actions are DELIBERATELY outside dollar accumulation — no per-action debit quantum, no grantless hard bound. The per-action audit row is the complete record and the intended signal; bounding a budgeted class remains available at any time by creating an objective grant (use cap + ledger + ceiling + revocation). The bare defaultGate continues to deny budgeted actions (proceed semantics exist only where the audit surface exists). Recorded low-key by owner instruction so the absence of dollar counting reads as intent, never as a defect: pinned by tests/hermetic/cf-inv-003/f-pt-024-grantless-budgeted.test.ts and noted in docs/approvals/design.md"}
  # Opened 2026-08-06 at #296 Stage 4; resolved the same day by the owner's YES.
  - {id: F-PT-023, status: resolved-ratified, resolved: 2026-08-06, subject: "consequence-split ratification: the §5.1–5.4 splits replace 'critical operations require human approval' with 'operations require the disposition their consequence class specifies'",
     resolution: "owner ratified all four splits in one decision (#296 ratification record, 2026-08-06; package docs/approvals/consequence-split-ratification.md §2). Harness revision registered the revised CORMIDIA-INV-003, the B-09b objective-grant/disposition clauses, and un-parked the CF-SPLIT-* families (case-catalog §10.1). Authorized: one rule per PR with red-then-green seeded controls, tightening-first, external-publishing last; ACTION_IDENTITY_VERSION bump cancelling in-flight grants at each split landing; compensating controls are part of each split and land with it or the split does not land"}
  # Opened 2026-08-07 at the #336 adapter-expansion harness revision (procedure:
  # agents-md-contribution.md). Each is a genuine gate-seam ambiguity the upstream
  # docs do not answer; dependent mechanism-level cases are parked BLOCKED:<finding>
  # in case-catalog.md. None changes any existing gate or bound.
  - {id: F-PT-025, status: open, subject: "OpenCode headless permission-ask semantics (B-23): upstream docs do not specify what a configured permission `ask` does under `opencode serve` with no interactive client (block? deny? hang?), and which mitigation is Cormidia's ratified gate-bridge mechanism — deny-by-default config with the Cormidia gate as sole approver via the plugin hook seam (tool.execute.before / permission.asked), or `--auto` plus gate-only enforcement — is an owner decision; the fake must not make this policy by fixture convenience"}
  - {id: F-PT-026, status: resolved-by-certification, resolved: 2026-08-07, subject: "Cursor gate-seam sufficiency (B-24): cursor-agent headless requires an explicit trust flag plus --force to apply edits and exposes a static deny-wins permissions config, but no documented dynamic per-action hook/approval seam; whether static native deny plus adapter-side enforcement honors INV-002's pre-execution gate classification at an acceptable tool_gate tier, or the capability profile must record a degraded/unsupported tier with narrowed role eligibility, is an owner decision",
     resolution: "the finding's premise (no dynamic per-action seam) was falsified by field evidence, so the question was empirical rather than a product-owner value call and no degraded-tier/role-narrowing decision is required. Certified live 2026-08-07 against cursor-agent 2026.08.04-aaa8809 (research/2026-08-07_cursor-adapter-certification.md, #338): a per-turn project .cursor/hooks.json preToolUse hook DOES fire under `-p --force` for Shell/Read/Write/Grep/Task, a {permission:deny} reply stops the action pre-execution (proven by side-effect absence on shell, file-write and subagent-shell probes — not by the model's own report), and a spawned subagent's own tool calls reach the same per-turn socket from the subagent's own conversation_id. Ratified rung: hooks.json preToolUse bridged to the in-process GateFn over a per-turn Unix socket, failClosed:true (Cursor's default is fail-OPEN), registered as the SOLE gate channel because beforeShellExecution/beforeReadFile fire for the same action and would double-consult the gate. Tier recorded: tool_gate=adapter, intra_turn_fanout=native (gated, not itemized) in cursor/v1. Static native deny (.cursor/cli.json permissions.deny composed from role-shaping) is retained as defense in depth, not as the enforcement. --force is unreachable until a pre-spend handshake proves the exact hook command end to end, and a post-turn executed-versus-allowed cross-check reports error_gate_not_observed rather than completed if anything ran ungated. RESIDUAL, deliberately not claimed as proven: the handshake cannot prove a future build still calls the hook (beforeSubmitPrompt does not fire headless, so there is no in-turn liveness signal); the claim is version-banded and re-certification on bump is required. `cursor-agent acp` remains the un-implemented fallback rung. Role eligibility is unchanged — roles.yaml is untouched and assigning any role to cursor still requires human ratification plus qualification evidence"}
  - {id: F-PT-027, status: resolved-by-evidence, resolved: 2026-08-07,
     subject: "Grok Build ACP permission-request coverage (B-25): whether grok agent stdio emits an ACP permission request for every tool-action class, what denial semantics apply, and whether any headless auto-approve analog can bypass the request path are unspecified upstream; the gate-bridge contract cannot be authored from a guess. Separately, live certification remains conditional on the recorded #339 human risk-review decision (sandbox repos only until it clears)",
     resolution: "Answered empirically against grok 1.0.0 (#339, research/2026-08-07_grok-build-adapter-certification.md). (1) COVERAGE IS INCOMPLETE BY DESIGN: read-only tools (read_file, list_dir, grep, web_search, todo_write and a fixed read-only shell list) never reach session/request_permission in any mode; the shell class does reach it under an isolated GROK_HOME/HOME (the earlier no-shell-routing observation was the operator's persisted always-approve suppressing it). (2) DENIAL SEMANTICS: reject-once is terminal (stopReason cancelled, cancellationCategory PermissionRejected, tool never runs); a PreToolUse hook deny fails the individual call with 'Hook denied: <reason>' and the turn continues, so the adapter's own escalation ledger maps denial to blocked_on_gate. (3) BYPASS: yes and silently, via --always-approve, --permission-mode bypassPermissions, _meta.yoloMode on session/new, or persisted [ui] permission_mode; session/new exposes no modes so the client cannot read or set it. RATIFIED MECHANISM: the PreToolUse hook is the gate (grok evaluates hooks FIRST, ahead of permission rules, remembered grants, read-only auto-approvals and the prompt policy, in every mode, and always-approve short-circuits only AFTER hooks), bridged over a per-turn Unix socket into hooks.gate; the ACP request path is a backstop through the same gate. Because grok's hook runner FAILS OPEN on every handler failure, the mechanism is only sound with a per-turn proof: a SessionStart handshake through the same socket is required before the prompt, and an unproven handshake or a bypass-shaped permission mode is a typed error_gate_unproven refusal with zero tokens spent — 'no permission request observed' is never approval. Certified live 2026-08-07 (CF-B25-L3, 2 turns/$0.058, violations empty; shell+read denied pre-execution; isolation sentinel: operator always-approve vs default inside the turn). CF-B25-* mechanism legs are unparked. The #339 human risk review remains OPEN and independently gates real-repo use; sandbox-only stands."}
  - {id: F-PT-028, status: resolved-by-evidence, resolved: 2026-08-07,
     subject: "Muse Code swarm gate seam (B-26): whether the 0.1.x beta exposes any hook/permission seam covering swarm-spawned agents' tool actions is unknown; the owner-decided fallback is already contract truth (no seam => tool_gate unsupported for swarm mode, fan-out disabled in the capability profile — never an ungated swarm), so only the mechanism-level swarm-gate cases park; resolution is field verification during #340 certification",
     resolution: "Field-verified during #340 certification against Muse Code 0.1.0-R708.1 (research/2026-08-07_muse-code-adapter-certification.md): NO hook/permission seam fires at all — not for swarm members and not for the parent. `muse exec` auto-approves headlessly (a bash call executed exit 0 under the default --approval-mode on-request with no round trip), and no managed hook of any event reached the per-turn socket across twenty installation configurations, including the TBH_MANAGED_HOOKS_PATH lane the #340 probe comment reported as working. The probe's raw artifacts are real and internally consistent, and its exact working manifest was recovered from disk (top-level `hooks` object, PascalCase events, no `matcher`, no `timeoutMs`) and adopted by the adapter; replaying it verbatim together with the probe's own HOME and XDG_CONFIG_HOME still does not fire, and the decisive test is in-band (a hook that writes nothing and opens nothing, so sandboxing cannot mask it) with bash executing outcome=success. Same binary, same bytes, same environment. The unexplained non-determinism is itself the finding and the disagreement remains open for a human. The owner-decided fallback therefore applies at its widest: tool_gate AND intra_turn_fanout are declared `unsupported`, subagent_spawn is refused at the bridge, and MuseRuntime fails closed with error_gate_seam_unavailable before provider construction on every turn whose seam is unproven — never an ungated turn, never an ungated swarm. The mechanism-level swarm-gate legs stay unproven against the real product and are covered offline only (CF-B26-SUBGATE mechanism case, explicitly labelled scripted evidence). CF-B26-L3 reports incomplete, never pass; roles.yaml untouched. Re-certification is mandatory on every version bump (#331/#332), and a human must resolve the probe disagreement before any role is assigned."}
  - {id: F-PT-001, status: resolved-by-docs, subject: "redaction scope"}
  - {id: F-PT-005, status: resolved-ratified, resolved: 2026-07-31, subject: "subscriber-set cutoff",
     resolution: "simulated-seat derivation human-ratified by adoption 2026-07-31: added subscribers inherit pending events; removed subscribers cease blocking retirement"}

