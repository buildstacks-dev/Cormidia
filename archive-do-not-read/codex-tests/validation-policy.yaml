coexistence:
  posture: parallel-greenfield
  isolated_root: ./
  protected_paths:
    - ../test/
    - ../eval/
  incumbent_gates: read_only
  ci_integration: additive_opt_in
  cutover_requires:
    - equivalence_evidence
    - explicit_human_ratification
    - named_owner
    - rollback_plan
    - deliberate_cutover

criticality_tiers:
  default: C3
  contained_overrides:
    read_only_projection_rendering:
      tier: C2
      justification: Presentation owns no workflow state or consequential decision.
      exclusions:
        - path_confinement
        - secret_redaction
        - authorization
        - consequential_decision_surfaces
        - evidence_truthfulness
  c4_use:
    status: open
    finding: PTF-006

invariants:
  - id: OPERON-INV-001
    name: work_identity_and_lineage
    statement: Admitted organizational work has one immutable org, one declared work scope, and durable causal lineage.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-002
    name: authority_and_tenant_confinement
    statement: Work can observe or affect only resources authorized by its recorded org/app scope; cross-org is never implicit.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-003
    name: capability_truthful_execution
    statement: A dependency-requiring step never starts or resumes on a known-missing, incompatible, unavailable, or unqualified capability, and dependency failure never becomes success.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-004
    name: one_workflow_authority
    statement: Every delivery action is authorized by one accepted EpisodePlan version whose completed history cannot be silently rewritten.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-005
    name: bounded_and_exact_resource_use
    statement: Provider work is reserved before execution, settled exactly once, and cannot silently continue past a hard ceiling or unknown usage.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-006
    name: specific_human_authorization
    statement: No consequential action executes without valid content-bound authority for that exact action, payload, scope, and context.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-007
    name: informed_escalation
    statement: No escalation can mint or widen authority unless its decision packet exposes the material decision in human-usable terms and is bound to the action.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-008
    name: truthful_external_effects
    statement: Every consequential effect has one authoritative lifecycle and stable identity; ambiguity is never guessed or blindly retried.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-009
    name: evidence_backed_claims
    statement: Operon never claims ready, complete, shipped, or successful without the authoritative evidence required by the accepted plan and product profile.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-010
    name: truth_preserving_recovery
    statement: Restart preserves accepted truth, resumes only a legal next action, and neither repeats still-valid work nor invents terminal outcomes.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-011
    name: governed_learning_activation
    statement: Raw observations and candidates cannot affect active future context without the required provenance and governance; no-learning is a valid episode outcome.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md
  - id: OPERON-INV-012
    name: critical_risk_quarantine
    statement: A deterministically detected unresolved critical safety incident blocks new provider, tool, and effect actions in the smallest safe scope until attributable resolution.
    enforcement: [runtime_guardrail, test]
    source: ./invariants.md

risk_model:
  status: ratified
  principle: Probability of failure multiplied by consequence of failure.
  consequence_dominance: >-
    Catastrophic or irreversible authority, isolation, destructive-effect,
    supply-chain, or persistent-context failures remain critical even when
    their estimated likelihood is low.
  likelihood:
    likely: Expected through normal change, complexity, external variance, or unattended operation.
    plausible: Credible under failure, concurrency, misuse, or adversarial input.
    unlikely: Requires unusual conjunctions but remains technically credible.
  impact:
    catastrophic: Irreversible or broad authority, data, security, financial, legal, or operational harm.
    major: Serious but containable loss of trust, quality, time, money, or availability.
    moderate: Bounded and recoverable product or operator harm.
    low: Presentation or convenience defect without persistent consequence.
  ratings:
    critical: Exhaustive deterministic assurance plus every applicable higher-layer obligation.
    high: Deep deterministic assurance with targeted live, eval, and operational evidence.
    moderate: Complete contracts and representative composition with targeted quality or operational checks.
    low: Focused contract and adapter smoke coverage.

coverage_profiles:
  critical:
    invariant_contract:
      depth: exhaustive
      requirements:
        - every_legal_and_illegal_transition
        - every_guardrail_violation_path
