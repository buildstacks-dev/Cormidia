     resolution: "owner decision 2026-08-12: the invariant stands as written — deny AND escalate. A classifier that throws is an anomaly a human must see: silent denial can mask a persistently broken classifier as universal refusal with no signal, which is availability damage compounding into an observability hole. All three gate bridges append a GateEscalation in their classifier-throw catch branches; the invariant text is unchanged (narrowing it was rejected as a tighten-only violation). Implementation owed under HB-150 (product change + detectors, red-then-green, incl. a seeded permissive-fallback control)",
     implemented: "2026-08-12 (HB-150): all three bridges' classifier-throw catch branches answer via classifierThrowDenial (src/runtime/adapters/gate-bridge-escalation.ts) — deny + GateEscalation; detectors in tests/hermetic/cf-inv-015/cf-inv-015-error-branch-sweep.test.ts (four-seed sweep, red-then-green incl. seeded allow-on-throw fallbacks) and the extended tests/hermetic/cf-inv-002/codex-hook-bridge.test.ts escalation assertions"}
