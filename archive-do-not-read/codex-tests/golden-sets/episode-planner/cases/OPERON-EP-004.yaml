schema_version: operon-episode-planner-case/v1
case_id: OPERON-EP-004
title: Production deployment is rollout and rollback governed
critical: true
sources:
  - docs/approvals/design.md
  - docs/episodes/contract.md
  - OPERON-INV-006
  - OPERON-INV-008
input:
  goal: Implement and release a bounded API compatibility fix to production with independent review.
  lifecycle: release
  app_stage: live
  repository_facts:
    release_mechanism_configured: true
    rollback_available: true
    production_target: configured app
  requested_constraints:
    independent_review_required: true
    rollout_gate_required: true
    rollback_gate_required: true
    critical_operation_approval_required: true
  hard_budget:
    maxProviderTurns: 3
    maxEquivalentCostUsd: 15
    maxMechanicalOverheadUsd: 0
    maxActiveTimeMs: 1200000
    maxHumanDecisions: 1
  required_safety_facts:
    - kind: production_deployment
      evidenceRefs: [case:OPERON-EP-004]
    - kind: independent_review
      evidenceRefs: [case:OPERON-EP-004]
  unavailable_roles: []
oracle:
  min_provider_turns: 3
  max_provider_turns: 3
  max_total_steps: 6
  required_provider_steps:
    - role: builder
      operation: build/implement
    - role: reviewer
      operation: review/verify
    - role: sre
      operation: deploy/release
  allowed_provider_operations: [build/implement, review/verify, deploy/release]
  required_gate_kinds: [rollout, rollback]
  required_approval_kinds: [critical-operation]
  require_independent_review: true
