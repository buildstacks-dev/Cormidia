        - crash_points_around_durable_and_external_effects
        - concurrency_and_replay
        - adversarial_untrusted_input
    live_sandbox:
      depth: required_for_unfakeable_semantics
      requirement: blocking
    eval_qualification:
      depth: blocking_when_model_mediated
      requirements:
        - frozen_golden_set
        - repeated_runs
        - trajectory_checks
        - calibrated_judge_when_applicable
    ops_hardening:
      depth: required
      requirement: blocking
