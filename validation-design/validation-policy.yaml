    Guardrail + test throughout, with one deliberate exception recorded honestly:
    CORMIDIA-INV-ACC-7a has no runtime guardrail that could prevent a supervising agent
    from running git itself. Its mechanism is detection (invocation audit x per-commit
    authorship x run-journal turn records) plus refusal to score — a scenario whose
    reconciliation does not close reports ungraded/incomplete, never a number.

