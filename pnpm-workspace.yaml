# pnpm config only — this repo is deliberately NOT a workspace (docs/PURPOSE.md →
# Repo shape); pnpm ≥11 also reads its per-repo settings from this file.
# pnpm 11.10.0 requires a non-empty selector even for a root-only project.
# Selecting only "." preserves the single-package repository boundary.
packages:
  - '.'
# Installs are an explicit lifecycle step (`pnpm install`); validation commands
# must never mutate or purge a linked worktree's dependency directory.
verifyDepsBeforeRun: false
# esbuild's postinstall downloads the platform binary tsx needs.
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
# Supply-chain window (#402): resolve only versions at least 3 days old, so a
# compromised release is likely yanked before it can be admitted. Previously
# this relied on pnpm's implicit default; the window is now explicit and the
# exclude list below is guaranteed meaningful.
minimumReleaseAge: 4320
# Dependency-audit baseline (#402): the scheduled dependency-audit workflow
# fails on any advisory NOT listed here. Every entry below was recorded
# 2026-08-11 — all transitive under the exact-pinned provider SDKs, none
# fixable without an upstream bump. Removing entries when an SDK bump clears
# them is part of that bump's change; adding one requires the same named
# justification as any baseline increase.
auditConfig:
  ignoreGhsas:
    - GHSA-frvp-7c67-39w9 # @hono/node-server moderate — serve-static path traversal (Windows)
    - GHSA-8j4g-w8fx-2239 # hono moderate — language middleware complexity DoS
    - GHSA-f23p-vx2j-j53r # hono moderate — memo() cross-request SSR retention
    - GHSA-54fx-42gc-7vw4 # hono moderate — CORS middleware ReDoS
    - GHSA-79qm-7rj5-m7r9 # hono low — proxy helper Connection-header passthrough
    - GHSA-v2hh-gcrm-f6hx # fast-uri high — host confusion (backslash delimiter)
    - GHSA-7p8r-x3mc-p8w7 # fast-uri high — host confusion (backslash introducer)
    - GHSA-mh99-v99m-4gvg # brace-expansion high — unbounded-expansion OOM DoS
    - GHSA-rgw5-rvv9-x895 # brace-expansion high — unbounded intermediate arrays DoS
    - GHSA-mwp4-54f8-5fhr # ip-address high — leading-zero octet SSRF bypass
    - GHSA-4xrf-jv44-h6hh # ip-address moderate — CIDR-suffix SSRF bypass
    - GHSA-22jq-vg5j-6vgg # ip-address moderate — IPv4-mapped/NAT64 misclassification
# pi ships ~3 releases/week, so the pinned version is always younger than the
# configured minimum release age. The allowance is exact-version by design: it
# names what we certified, never a range, so a later upload is not admitted
# silently. pi 0.84 split pi-client/pi-protocol/pi-telemetry out of the
# coding-agent package — new names, same single pinned version.
minimumReleaseAgeExclude:

  # pi 0.84.1 (#335) — the 0.80.7 entries retired with the pin they excluded.
  - '@earendil-works/pi-agent-core@0.84.1'
  - '@earendil-works/pi-ai@0.84.1'
  - '@earendil-works/pi-client@0.84.1'
  - '@earendil-works/pi-coding-agent@0.84.1'
  - '@earendil-works/pi-protocol@0.84.1'
  - '@earendil-works/pi-telemetry@0.84.1'
  - '@earendil-works/pi-tui@0.84.1'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.224'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.224'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.224'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.224'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.224'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.224'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.224'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.224'
  - '@anthropic-ai/claude-agent-sdk@0.3.224'
  # @openai/codex 0.147.0 was published the same day it was pinned (#335), so it
  # is younger than the configured minimum release age. The refresh certified
  # this exact version — see research/adapters/2026-08-07_codex-0.147-refresh.md — and the
  # platform-tagged entries are the optional per-arch payloads of that one pin.
  - '@openai/codex@0.147.0'
  - '@openai/codex@0.147.0-darwin-arm64'
  - '@openai/codex@0.147.0-darwin-x64'
  - '@openai/codex@0.147.0-linux-arm64'
  - '@openai/codex@0.147.0-linux-x64'
  - '@openai/codex@0.147.0-win32-arm64'
  - '@openai/codex@0.147.0-win32-x64'
  # @opencode-ai/sdk 1.18.15 (#337) — the generated v2 client for the exact
  # opencode build the adapter certified against; pinned newer than the age
  # window, and exact-version by design like every entry above.
  - '@opencode-ai/sdk@1.18.15'
