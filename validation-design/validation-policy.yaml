  - {id: F-PT-034, status: resolved-ratified, resolved: 2026-08-12,
     subject: "B-08 non-admission vocabulary is open-ended while HB-142 requires 'the full named non-admission vocabulary': the contract's §2 list literally ends with an ellipsis; docs/scheduler/design.md 'Outcomes and reason codes' declares a closed canonical table whose Execution/admission row includes scheduler_definition_failure and scheduler_state_failure; the product type (src/org/scheduler/model.ts) carries both members; and a malformed schedule trigger currently THROWS from src/org/schedule.ts parsing instead of terminating in a named reason. The admission-matrix ticket cannot enumerate a vocabulary the contract leaves open",
     resolution: "owner decision 2026-08-12: the vocabulary is CLOSED. B-08 §2's execution/admission set is exactly the 20-member Execution/admission row of docs/scheduler/design.md 'Outcomes and reason codes', which remains the canonical table; adding a member is a contract revision, never an in-code addition. scheduler_definition_failure and scheduler_state_failure are real runtime-triggered reasons: a malformed schedule/trigger definition and corrupt or unreadable scheduler state terminate as validated non-admission with durable evidence, never a thrown crash — errors reduce capability and leave evidence (INV-015). Closing an open list and converting a crash path to evidenced non-admission are both tighten-only. Implementation owed under HB-142 (product change + detectors, red-then-green)",
     implemented: "2026-08-12 HB-142: src/org/schedule.ts (typed ScheduleDefinitionError/ScheduleStateError, validated last-fired state — parse, don't cast), src/org/dispatch.ts (named non-admission routing for both reasons, fail-closed budget-overlay read per B-08 section 3, no terminalizing of a live execution's pending decision by a later tick's backpressure observation); detectors red-then-green in tests/hermetic/cf-c-b08-cf-j09-a-cf-j09-i-cf-j09-r-cf-j09-s/"}
  - {id: F-PT-035, status: resolved-ratified, resolved: 2026-08-12,
     subject: "J-11 (contracts/journey-acceptance.md) says any external publication path requires its own exact-payload approval + execution acknowledgement, while the ratified #296 §5.3 consequence split (F-PT-023; docs/approvals/design.md) replaces external-publishing with budgeted repo-collaboration for verified own-repository actions and the landed split detectors enforce it — yet src/org/standing-roles.ts queueIncidentFiling still searches for an external-publishing action record and fails when an allowed operation lacks one. HB-143 cannot exercise the incident journey while the two ratified surfaces disagree",
     resolution: "owner decision 2026-08-12: source-linked op:incident filing into the app's OWN configured repository is budgeted repo-collaboration (per-action audit row; own-repo verification precedes any grant matching; anything foreign, dynamic, or unverifiable refines to human-only repo-collaboration-foreign, unchanged). J-11's 'external' is aligned to mean outside the app's own configured repositories — the clause predated the split and was never a decision to keep own-repo incident filing human-only; keeping it exact-payload would contradict the split detectors already on main and defeat autonomous SRE incident filing. queueIncidentFiling moves to the repo-collaboration rule. Implementation owed under HB-143 (product change + detectors, red-then-green)"}
  - {id: F-PT-036, status: resolved-ratified, resolved: 2026-08-12,
