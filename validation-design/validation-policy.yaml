     resolution: "owner decision 2026-08-12: the terminal status is `interrupted`. The ratified CORMIDIA-C-CORE-001 vocabulary wins and the implementation's `timed_out` migrates to it — the contract is not rewritten from code (the F-PT-012 pattern, resolved the contract's way). `interrupted` is REQUIRED to carry a machine-readable reason (`time_limit`, `operator_kill`, `provider_crash`) so the specificity `timed_out` carried in its NAME is not lost when the name widens. THE SHAPE QUESTION THE OWNER REQUIRED TO BE CHECKED RESOLVES WITHOUT STRUCTURAL CHANGE: TurnResult already exposes a machine-code channel (`errorCode`), and requiring a reason on the interrupted arm is a clause tightening inside an existing contract — no new journey, boundary, invariant, or LLM call site, so no harness-revision event and no STOP. MIGRATION COMPATIBILITY IS PART OF THE RULING: durable records already written with `timed_out` stay readable and project as `interrupted` with reason `time_limit`, which is exactly what the retired name meant. The vocabulary is asserted across EVERY adapter plus the migration-compatibility case per HB-P6's acceptance, and no test derives the answer from current code. Scope fence recorded at the owner's instruction: the landed tests/unit/s3-verdict-marker.test.ts regression pins confer NO ratification here, and F-PT-033 — a different, still-open S-3 verdict-marker question — is untouched by this ruling. Implementation owed under HB-P6 (product change + detectors, red-then-green)"}
