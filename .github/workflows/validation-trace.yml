name: validation-trace

# Deterministic design-to-implementation closure. This is offline L1/L2
# evidence only: it authorizes no provider turn or acceptance campaign.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compute:
        description: Run this exact ref on the Mac runner or GitHub-hosted fallback
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - github-hosted
      expected_sha:
        description: Exact 40-character commit SHA the manual run must validate
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'workflow_dispatch' && inputs.compute == 'github-hosted')) && 'ubuntu-latest' || 'cormidia-core-linux-arm64' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Refuse a drifted manual candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check design-to-implementation closure
        run: pnpm validation:trace
