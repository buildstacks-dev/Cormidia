  - {id: F-PT-012, status: open, subject: "app-reset execute order: ratified prose (registry removal before local clears, OP-lifecycle §6) vs deliberate code design (local clears first; registry removal as atomic commit point, app-reset.ts finalizeInterruptedAppReset)"}
