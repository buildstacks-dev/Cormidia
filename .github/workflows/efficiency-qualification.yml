name: Efficiency qualification

on:
  pull_request:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:validate
      - run: pnpm test:transformation
      - run: pnpm eval:deterministic
      - run: pnpm test
      - run: pnpm typecheck
      - name: Nightly deterministic flake tripwire
        if: github.event_name == 'schedule'
        run: pnpm eval:deterministic:nightly
      - name: Strict final-phase gate
        run: pnpm test:transformation:strict
